:root{

  --p2:#d94f7a; --p2b:#fbe6ee; /* 精细动作 粉红 */
  --p3:#3a9d6a; --p3b:#e3f4ea; /* 感知觉 绿 */
  --p4:#3b82c4; --p4b:#e4eefb; /* 认知 蓝 */
  --warm:#f6a04d; --warmb:#fdeedd;

  --ok:#3a9d6a; --doing:#f0a836; --todo:#cfc8d6;
  --shadow:0 2px 14px rgba(120,90,160,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
h1,h2,h3,h4{margin:0;font-weight:700}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 90px}
/* header */
.top{background:linear-gradient(135deg,#8b6fd0,#c46aa0);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(140,90,170,.2)}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.babyface{width:44px;height:44px;border-radius:50%;background:#fff3;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.top h1{font-size:18px}
.top .sub{font-size:12.5px;opacity:.9;margin-top:1px}
.top .gear{margin-left:auto;font-size:20px;opacity:.95;background:#ffffff22;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
/* tabs */
.tabs{display:flex;background:var(--card);position:sticky;top:78px;z-index:19;box-shadow:var(--shadow);border-radius:0 0 16px 16px;max-width:880px;margin:0 auto;overflow:hidden}
.tabs button{flex:1;padding:11px 4px 9px;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;transition:.15s}
.tabs button .ic{display:block;font-size:18px;margin-bottom:1px}
.tabs button.on{color:var(--p1);border-bottom-color:var(--p1);font-weight:600}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-top:14px}
.card h2{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--p1);color:#fff;padding:9px 15px;border-radius:10px;font-size:14px;font-weight:600}
.btn.sec{background:var(--p1b);color:var(--p1)}
.btn.ghost{background:#f3eef8;color:var(--muted)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
label.fld{display:block;margin:8px 0}
label.fld span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.divider{height:1px;background:var(--line);margin:14px 0}
/* schedule timeline */
.bandbar{display:flex;align-items:center;gap:10px;background:var(--warmb);border-radius:12px;padding:10px 13px;margin-bottom:6px;flex-wrap:wrap}
.bandbar b{color:var(--warm)}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin:12px 0}
.tgt{background:#faf7fc;border:1px solid var(--line);border-radius:12px;padding:10px}
.tgt .t{font-size:12px;color:var(--muted)}
.tgt .v{font-size:14px;font-weight:700;margin-top:2px}
.tl{position:relative;margin-top:6px;padding-left:8px}
.ev{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:none}
.ev .tm{width:50px;flex-shrink:0;font-weight:700;font-size:13.5px;color:var(--ink)}
.ev .dot{width:30px;flex-shrink:0;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px}
.ev .bd{flex:1;min-width:0}
.ev .bd .ti{font-weight:600;font-size:14px}
.ev .bd .de{font-size:12.7px;color:var(--muted);margin-top:1px}

.dimtabs button{padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;background:#f1ecf6;color:var(--muted)}
.dimtabs button.on{color:#fff}
.prog{height:9px;background:#eee;border-radius:6px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;border-radius:6px}
.bandgrp{margin-top:14px}
.bandgrp .bh{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.bandgrp .bh .cur{background:var(--warm);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:10px}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.node{border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;cursor:pointer;transition:.12s;position:relative}
.node .nt{font-size:13px;font-weight:600;line-height:1.35}
.node .nc{font-size:10.5px;color:var(--muted);margin-top:2px}
.node .nn{font-size:11px;color:var(--p1);margin-top:4px;display:none}
.node.has-note .nn{display:block}
.node[data-s="done"]{border-color:var(--ok);background:#f1faf4}
.node[data-s="doing"]{border-color:var(--doing);background:#fff8ec}
.node .mk{position:absolute;top:6px;right:7px;font-size:13px}
/* records */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.seg button{padding:6px 12px;border-radius:18px;font-size:12.5px;background:#f1ecf6;color:var(--muted);font-weight:600}
.seg button.on{background:var(--p1);color:#fff}
.daygrp{margin-top:14px}
.daygrp .dh{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;padding-bottom:5px;border-bottom:2px solid var(--line)}
.daygrp .dh .sum{font-size:11.5px;color:var(--muted);font-weight:500}
.rec{display:flex;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
.rec .rt{width:48px;font-weight:700;font-size:13px;color:var(--muted)}
.rec .ri{width:26px;text-align:center;font-size:15px}
.rec .rc{flex:1;font-size:13.5px}
.rec .rc small{color:var(--muted)}
.rec .del{color:var(--p2);font-size:12px;opacity:.6}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
.empty .big{font-size:34px;display:block;margin-bottom:6px}
/* modal */
.mask{position:fixed;inset:0;background:#3d3a4e88;z-index:40;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px 26px;max-height:88vh;overflow:auto;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between}
.sheet .x{color:var(--muted);font-size:20px}
.note-warn{background:var(--warmb);color:#9a6520;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:8px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:22px;line-height:1.7}
@media(min-width:560px){.sheet{border-radius:20px;margin-bottom:auto;margin-top:auto}.mask{align-items:center}}
</style>
</head>

function ageToRoutineKey(m){if(m<4)return'0-3M';if(m<7)return'4-6M';if(m<10)return'7-9M';if(m<13)return'10-12M';if(m<19)return'13-18M';if(m<25)return'19-24M';return'25-36M';}
function ageToBandIdx(m){if(m<4)return 0;if(m<7)return 1;if(m<10)return 2;if(m<13)return 3;if(m<19)return 4;if(m<25)return 5;if(m<31)return 6;if(m<37)return 7;return 8;}

/* ============ 工具 ============ */
function ageInfo(refDate){
  const b=new Date(DB.profile.birth+'T00:00:00');const r=refDate?new Date(refDate+'T00:00:00'):new Date();
  let mo=(r.getFullYear()-b.getFullYear())*12+(r.getMonth()-b.getMonth());let d=r.getDate()-b.getDate();
  if(d<0){mo--;const pm=new Date(r.getFullYear(),r.getMonth(),0).getDate();d+=pm;}
  const totalMonths=mo; return {months:totalMonths,text:Math.floor(mo/12)>0?`${Math.floor(mo/12)}岁${mo%12}个月${d}天`:`${mo}个月${d}天`};
}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function shiftTime(hhmm,deltaMin){const[h,m]=hhmm.split(':').map(Number);let t=h*60+m+deltaMin;t=((t%1440)+1440)%1440;return pad(Math.floor(t/60))+':'+pad(t%60);}
const KICON={sleep:'😴',feed:'🍼',play:'🧸',meal:'🥣',care:'🛁',out:'🌳',wake:'🌅'};

/* ============ 今日日程 ============ */
let dayDate=todayStr();
function renderDay(){
  const a=ageInfo(dayDate);const key=ageToRoutineKey(a.months);const R=ROUTINES[key];
  const wake=DB.pref.wake||'07:00';const delta=(()=>{const[h,m]=wake.split(':').map(Number);return h*60+m-7*60;})();
  let h='';
  h+=`<div class="card"><div class="row" style="justify-content:space-between">
    <h2>🗓️ 今日日程</h2>

  </div>
  <div class="bandbar"><b>${R.label}</b><span class="small muted">${a.text}</span>
   <label class="small" style="margin-left:auto">起床时间 <input type="time" value="${wake}" style="width:auto;display:inline-block;padding:4px 7px" onchange="DB.pref.wake=this.value;save();renderDay()"></label>
  </div>
  <div class="small muted" style="margin:2px 0 4px">💡 ${R.tip}</div>
  <div class="targets">${Object.entries(R.targets).map(([k,v])=>`<div class="tgt"><div class="t">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
  <div class="tl">`;
  R.list.forEach(([t,k,ti,de,sk])=>{
    h+=`<div class="ev"><div class="tm">${shiftTime(t,delta)}</div>
      <div class="dot k-${k}">${KICON[k]||'•'}</div>
      <div class="bd"><div class="ti">${ti}</div>${de?`<div class="de">${de}</div>`:''}
      ${sk?`<span class="skref" onclick="go('skill');setTimeout(()=>focusDim('${sk}'),60)">🌳 去技能树看「${DIMS[sk].name}」</span>`:''}
      </div></div>`;
  });
  h+=`</div></div>`;
  // 本月龄重点技能
  const bi=ageToBandIdx(a.months);
  h+=`<div class="card"><h2>⭐ 本月龄重点技能 <span class="small muted">(${BANDS[bi]})</span></h2>
   <div class="small muted" style="margin-bottom:6px">在技能树里标记掌握情况，日程会聚焦这些方向。</div>`;
  Object.entries(DIMS).forEach(([dk,dim])=>{
    const ns=dim.nodes.map((n,i)=>[n,i]).filter(([n])=>n[0]===bi);
    if(!ns.length)return;
    h+=`<div style="margin-top:8px"><div class="small" style="font-weight:700;color:${dim.color}">${dim.icon} ${dim.name}</div><div class="nodes" style="margin-top:5px">`;
    ns.forEach(([n,i])=>{const id=dk+'_'+i;const s=(DB.skills[id]||{}).status||'todo';
      h+=`<div class="node" data-s="${s}" onclick="cycleSkill('${id}');renderDay()"><div class="nt">${n[1]}</div><span class="mk">${s==='done'?'✅':s==='doing'?'🔸':'⬜'}</span></div>`;});
    h+=`</div></div>`;
  });
  h+=`</div>`;
  document.getElementById('view-day').innerHTML=h;
}

/* ============ 技能树 ============ */
let curDim='gross';
function focusDim(d){curDim=d;renderSkill();}
function renderSkill(){
  const a=ageInfo();const curBand=ageToBandIdx(a.months);
  let h=`<div class="card"><h2>🌳 技能树</h2>
   <div class="small muted" style="margin-bottom:8px">点节点切换：⬜未开始 → 🔸正在练 → ✅已掌握。长按(或点📝)记笔记。</div>
   <div class="dimtabs">`;
  Object.entries(DIMS).forEach(([k,d])=>{h+=`<button class="${k===curDim?'on':''}" style="${k===curDim?`background:${d.color}`:''}" onclick="focusDim('${k}')">${d.icon} ${d.name}</button>`;});
  h+=`</div>`;
  const dim=DIMS[curDim];
  const total=dim.nodes.length;let done=0,doing=0;
  dim.nodes.forEach((n,i)=>{const s=(DB.skills[curDim+'_'+i]||{}).status;if(s==='done')done++;else if(s==='doing')doing++;});
  h+=`<div class="prog"><i style="width:${total?Math.round(done/total*100):0}%;background:${dim.color}"></i></div>
   <div class="small muted">已掌握 ${done} · 正在练 ${doing} · 共 ${total} 项</div>`;
  // group by band
  for(let b=0;b<BANDS.length;b++){
    const ns=dim.nodes.map((n,i)=>[n,i]).filter(([n])=>n[0]===b);
    if(!ns.length)continue;
    h+=`<div class="bandgrp"><div class="bh">${BANDS[b]} ${b===curBand?'<span class="cur">当前月龄</span>':''}</div><div class="nodes">`;
    ns.forEach(([n,i])=>{const id=curDim+'_'+i;const o=DB.skills[id]||{};const s=o.status||'todo';
      h+=`<div class="node ${o.note?'has-note':''}" data-s="${s}">
        <div onclick="cycleSkill('${id}');renderSkill()"><div class="nt">${n[1]}</div></div>
        <span class="mk" onclick="cycleSkill('${id}');renderSkill()">${s==='done'?'✅':s==='doing'?'🔸':'⬜'}</span>
        ${o.note?`<div class="nn">📝 ${o.note}</div>`:''}
        <div class="small" style="margin-top:4px;color:var(--muted);cursor:pointer" onclick="noteSkill('${id}','${n[1].replace(/'/g,'')}')">📝 笔记</div>
      </div>`;});
    h+=`</div></div>`;
  }
  h+=`</div>`;
  document.getElementById('view-skill').innerHTML=h;
}
function cycleSkill(id){const o=DB.skills[id]||{};const s=o.status||'todo';
  o.status=s==='todo'?'doing':s==='doing'?'done':'todo';o.date=todayStr();DB.skills[id]=o;save();}
function noteSkill(id,label){const o=DB.skills[id]||{};
  openSheet(`<h3>📝 ${label}<span class="x" onclick="closeSheet()">×</span></h3>
   <label class="fld"><span>观察笔记（蒙氏：记录你观察到的进展）</span><textarea id="nt">${o.note||''}</textarea></label>
   <div class="row"><button class="btn" onclick="DB.skills['${id}']=Object.assign(DB.skills['${id}']||{},{note:document.getElementById('nt').value});save();closeSheet();renderSkill()">保存</button>
   <button class="btn ghost" onclick="closeSheet()">取消</button></div>`);
}

/* ============ 喂养记录 ============ */
const RTYPES={
  feed_breast:{i:'🤱',n:'母乳'},feed_formula:{i:'🍼',n:'配方奶'},feed_solid:{i:'🥣',n:'辅食'},
  sleep:{i:'😴',n:'睡眠'},diaper_pee:{i:'💧',n:'尿尿'},diaper_poop:{i:'💩',n:'便便'},
  vitamin:{i:'💊',n:'补充剂'},walk:{i:'🌳',n:'户外'},bath:{i:'🛁',n:'洗澡'},growth:{i:'📏',n:'生长'},other:{i:'•',n:'其他'}};
let recFilter='all';
function recDesc(r){
  if(r.type==='feed_breast')return`母乳 左${r.leftMin||0}分 右${r.rightMin||0}分`;
  if(r.type==='feed_formula')return`配方奶 <b>${r.ml||0}ml</b>`;
  if(r.type==='feed_solid')return`辅食 ${r.food||''}${r.ml?` <small>${r.ml}ml</small>`:''}`;
  if(r.type==='sleep')return`睡眠 ${fmtDur(r.durationMin)}`;
  if(r.type==='growth')return[r.weightKg?`体重 ${r.weightKg}kg`:'',r.heightCm?`身高 ${r.heightCm}cm`:'',r.note||''].filter(Boolean).join(' ');
  if(r.type==='walk')return`户外 ${r.durationMin?fmtDur(r.durationMin):''}`;
  return (RTYPES[r.type]||RTYPES.other).n+(r.note?` <small>${r.note}</small>`:'');
}
function fmtDur(m){if(!m)return'';const h=Math.floor(m/60);return(h?h+'h':'')+(m%60?(m%60)+'m':(h?'':'0m'));}
function sleepMinOnDay(day){const s0=new Date(day+'T00:00:00').getTime();const s1=s0+86400000;let t=0;
  DB.records.forEach(r=>{if(r.type!=='sleep'||!r.durationMin)return;const st=new Date(r.dt).getTime();const en=st+r.durationMin*60000;const ov=Math.min(en,s1)-Math.max(st,s0);if(ov>0)t+=ov/60000;});return Math.round(t);}
function dkey(iso){return iso.slice(0,10);}
function dtime(iso){return iso.slice(11,16);}
function renderRec(){
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><h2>🍼 喂养记录</h2>
    <div class="row"><button class="btn sm" onclick="addRec()">＋ 记一笔</button>
    <button class="btn sm sec" onclick="importSheet()">⬇️ 导入</button></div></div>
   <div class="seg">
    ${['all','feed','sleep','diaper','growth'].map(f=>`<button class="${recFilter===f?'on':''}" onclick="recFilter='${f}';renderRec()">${({all:'全部',feed:'喂养',sleep:'睡眠',diaper:'尿布',growth:'生长'})[f]}</button>`).join('')}
   </div>`;
  let recs=DB.records.slice().sort((a,b)=>b.dt.localeCompare(a.dt));
  recs=recs.filter(r=>{if(recFilter==='all')return true;if(recFilter==='feed')return r.type.startsWith('feed');if(recFilter==='sleep')return r.type==='sleep';if(recFilter==='diaper')return r.type.startsWith('diaper');if(recFilter==='growth')return r.type==='growth';return true;});
  if(!recs.length){h+=`<div class="empty"><span class="big">🍼</span>还没有记录。<br>点「记一笔」手动添加，或「导入」把 Piyolog 等 App 的数据迁过来。</div>`;}
  else{
    const days={};recs.forEach(r=>{(days[dkey(r.dt)]=days[dkey(r.dt)]||[]).push(r);});
    Object.keys(days).sort((a,b)=>b.localeCompare(a)).forEach(day=>{
      const list=days[day];const all=DB.records.filter(r=>dkey(r.dt)===day);
      let ml=0,lmin=0,rmin=0,pee=0,poop=0,solid=0;const sleep=sleepMinOnDay(day);
      all.forEach(r=>{if(r.type==='feed_formula')ml+=r.ml||0;if(r.type==='feed_breast'){lmin+=r.leftMin||0;rmin+=r.rightMin||0;}if(r.type==='diaper_pee')pee++;if(r.type==='diaper_poop')poop++;if(r.type==='feed_solid')solid++;});
      const sum=[ml?`奶${ml}ml`:'',(lmin+rmin)?`母乳${lmin+rmin}分`:'',solid?`辅食${solid}`:'',sleep?`睡${fmtDur(sleep)}`:'',poop?`💩${poop}`:''].filter(Boolean).join(' · ');
      h+=`<div class="daygrp"><div class="dh"><span>${fmtDay(day)}</span><span class="sum">${sum}</span></div>`;
      list.forEach(r=>{h+=`<div class="rec"><div class="rt">${dtime(r.dt)}</div><div class="ri">${(RTYPES[r.type]||RTYPES.other).i}</div>
        <div class="rc">${recDesc(r)}</div><button class="del" onclick="delRec('${r.id}')">删除</button></div>`;});
      h+=`</div>`;
    });
  }
  h+=`</div>
   <div class="card"><h2>💾 备份与导出</h2>
    <div class="row"><button class="btn sm sec" onclick="exportJSON()">导出完整备份(JSON)</button>
    <button class="btn sm sec" onclick="exportCSV()">导出记录(CSV)</button></div>
    <div class="note-warn">数据仅存于本设备浏览器。换设备/清缓存前请先导出备份。</div></div>`;
  document.getElementById('view-rec').innerHTML=h;
}
function fmtDay(d){const dt=new Date(d+'T00:00:00');const w='日一二三四五六'[dt.getDay()];const t=todayStr();
  return `${dt.getMonth()+1}月${dt.getDate()}日 周${w}`+(d===t?' · 今天':'');}
function delRec(id){if(confirm('删除这条记录？')){DB.records=DB.records.filter(r=>r.id!==id);save();renderRec();}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function addRec(){
  const now=new Date();const dl=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'T'+pad(now.getHours())+':'+pad(now.getMinutes());
  openSheet(`<h3>＋ 记一笔<span class="x" onclick="closeSheet()">×</span></h3>
   <label class="fld"><span>类型</span><select id="rty" onchange="recFields()">
     ${Object.entries(RTYPES).filter(([k])=>k!=='other').map(([k,v])=>`<option value="${k}">${v.i} ${v.n}</option>`).join('')}</select></label>
   <label class="fld"><span>时间</span><input type="datetime-local" id="rdt" value="${dl}"></label>
   <div id="rfields"></div>
   <div class="row" style="margin-top:12px"><button class="btn" onclick="saveRec()">保存</button><button class="btn ghost" onclick="closeSheet()">取消</button></div>`);
  recFields();
}
function recFields(){const t=document.getElementById('rty').value;let h='';
  if(t==='feed_formula')h=`<label class="fld"><span>奶量 ml</span><input type="number" id="f_ml" placeholder="例如 100"></label>`;
  else if(t==='feed_breast')h=`<div class="row"><label class="fld" style="flex:1"><span>左 (分钟)</span><input type="number" id="f_l"></label><label class="fld" style="flex:1"><span>右 (分钟)</span><input type="number" id="f_r"></label></div>`;
  else if(t==='feed_solid')h=`<label class="fld"><span>食物</span><input type="text" id="f_food" placeholder="例如 蛋黄+米粉"></label><label class="fld"><span>量 ml(可选)</span><input type="number" id="f_ml"></label>`;
  else if(t==='sleep')h=`<label class="fld"><span>时长 (分钟)</span><input type="number" id="f_dur" placeholder="例如 90"></label>`;
  else if(t==='walk')h=`<label class="fld"><span>时长 (分钟)</span><input type="number" id="f_dur"></label>`;
  else if(t==='growth')h=`<div class="row"><label class="fld" style="flex:1"><span>体重 kg</span><input type="number" step="0.01" id="f_w"></label><label class="fld" style="flex:1"><span>身高 cm</span><input type="number" step="0.1" id="f_h"></label></div>`;
  else if(t.startsWith('diaper')||t==='vitamin')h=`<label class="fld"><span>备注(可选)</span><input type="text" id="f_note"></label>`;
  document.getElementById('rfields').innerHTML=h;
}
function gv(id){const e=document.getElementById(id);return e?e.value:'';}
function saveRec(){const t=document.getElementById('rty').value;const dt=document.getElementById('rdt').value;
  if(!dt){alert('请选时间');return;}
  const r={id:uid(),dt,type:t};
  if(t==='feed_formula')r.ml=+gv('f_ml')||0;
  if(t==='feed_breast'){r.leftMin=+gv('f_l')||0;r.rightMin=+gv('f_r')||0;}
  if(t==='feed_solid'){r.food=gv('f_food');r.ml=+gv('f_ml')||null;}
  if(t==='sleep'||t==='walk')r.durationMin=+gv('f_dur')||0;
  if(t==='growth'){r.weightKg=+gv('f_w')||null;r.heightCm=+gv('f_h')||null;}
  if(gv('f_note'))r.note=gv('f_note');
  DB.records.push(r);save();closeSheet();renderRec();
}

/* ============ Piyolog 导入 ============ */
function importSheet(){
  openSheet(`<h3>⬇️ 导入记录<span class="x" onclick="closeSheet()">×</span></h3>
   <div class="small muted">支持 <b>Piyolog(Piyo日志)</b> 导出的文本(.txt)，自动识别母乳/配方奶/辅食/睡眠/尿布/体重等。也可恢复本工具的 JSON 备份。</div>
   <label class="fld" style="margin-top:10px"><span>① 选择文件</span><input type="file" id="impf" accept=".txt,.json" onchange="impFile(event)"></label>
   <div class="small muted" style="text-align:center;margin:4px 0">— 或 —</div>
   <label class="fld"><span>② 直接粘贴 Piyolog 文本</span><textarea id="imptx" placeholder="把导出内容整段粘贴到这里…"></textarea></label>
   <div id="imppv"></div>
   <div class="row" style="margin-top:10px"><button class="btn" onclick="doImportText()">解析并预览</button><button class="btn ghost" onclick="closeSheet()">取消</button></div>`);
}
function impFile(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const txt=rd.result;
    if(f.name.endsWith('.json')){try{const d=JSON.parse(txt);restoreBackup(d);}catch(err){alert('JSON 解析失败');}return;}
    document.getElementById('imptx').value=txt;doImportText();};
  rd.readAsText(f);}
function parseDur(s){let h=0,m=0;const hm=s.match(/(\d+)\s*(?:小时|時間|时)/);if(hm)h=+hm[1];const mm=s.match(/(\d+)\s*分/);if(mm)m=+mm[1];return h*60+m;}
function toISO(y,mo,d,hh,mm){return `${y}-${pad(mo)}-${pad(d)}T${pad(hh)}:${pad(mm)}`;}
function parsePiyolog(txt){
  const lines=txt.split(/\r?\n/);let cy,cmo,cd;const out=[];
  const dre=/(\d{4})年(\d{1,2})月(\d{1,2})日/;
  const ere=/^(\d{1,2}):(\d{2})\s+(.+)$/;
  for(let raw of lines){
    const line=raw.trim();
    const dm=line.match(dre);if(dm){cy=+dm[1];cmo=+dm[2];cd=+dm[3];continue;}
    if(/共\s/.test(line))continue; // 汇总行
    const em=line.match(ere);if(!em||!cy)continue;
    const hh=+em[1],mm=+em[2],c=em[3].trim();
    const iso=toISO(cy,cmo,cd,hh,mm);let r=null;
    if(c.startsWith('起床')){const dur=parseDur(c);if(dur>0){const end=new Date(cy,cmo-1,cd,hh,mm);const st=new Date(end.getTime()-dur*60000);
        r={dt:toISO(st.getFullYear(),st.getMonth()+1,st.getDate(),st.getHours(),st.getMinutes()),type:'sleep',durationMin:dur};}}
    else if(c.startsWith('睡觉')){r=null;}
    else if(c.startsWith('母乳')){let l=0,rr=0;const lm=c.match(/左\s*(\d+)\s*分/);if(lm)l=+lm[1];const rm=c.match(/右\s*(\d+)\s*分/);if(rm)rr=+rm[1];r={dt:iso,type:'feed_breast',leftMin:l,rightMin:rr};}
    else if(c.startsWith('配方奶')||c.startsWith('奶粉')){const m=c.match(/(\d+)\s*ml/i);r={dt:iso,type:'feed_formula',ml:m?+m[1]:0};}
    else if(c.startsWith('断奶食品')||c.startsWith('辅食')){let food=c.replace(/^断奶食品|^辅食/,'').trim();const m=food.match(/(\d+)\s*ml/i);r={dt:iso,type:'feed_solid',food:food,ml:m?+m[1]:null};}
    else if(c.includes('维生素')||c.includes('VD')||c.includes('AD')){r={dt:iso,type:'vitamin',note:c};}
    else if(c.startsWith('散步')||c.startsWith('户外')){r={dt:iso,type:'walk',durationMin:parseDur(c)};}
    else if(c.startsWith('便便')){const n=c.match(/[（(](.+?)[）)]/);r={dt:iso,type:'diaper_poop',note:n?n[1]:''};}
    else if(c.startsWith('尿尿')||c.startsWith('小便')){const n=c.match(/[（(](.+?)[）)]/);r={dt:iso,type:'diaper_pee',note:n?n[1]:''};}
    else if(c.startsWith('洗澡')){r={dt:iso,type:'bath'};}
    else if(c.startsWith('体重')){const m=c.match(/([\d.]+)\s*kg/i);const note=c.replace(/体重\s*[\d.]+\s*kg/i,'').trim();r={dt:iso,type:'growth',weightKg:m?+m[1]:null,note};}
    else if(c.startsWith('身高')){const m=c.match(/([\d.]+)\s*cm/i);r={dt:iso,type:'growth',heightCm:m?+m[1]:null};}
    if(r)out.push(r);
  }
  return out;
}
let pendingImport=null;
function doImportText(){const txt=document.getElementById('imptx').value;
  if(!txt.trim()){alert('请粘贴内容或选择文件');return;}
  const parsed=parsePiyolog(txt);
  if(!parsed.length){document.getElementById('imppv').innerHTML=`<div class="note-warn">没识别到记录。确认是 Piyolog 导出的文本？</div>`;return;}
  // dedupe against existing
  const sig=r=>[r.dt,r.type,r.ml||'',r.leftMin||'',r.rightMin||'',r.food||'',r.durationMin||'',r.weightKg||''].join('|');
  const have=new Set(DB.records.map(sig));
  const fresh=parsed.filter(r=>!have.has(sig(r)));
  pendingImport=fresh;
  const cnt={};parsed.forEach(r=>cnt[r.type]=(cnt[r.type]||0)+1);
  const days=new Set(parsed.map(r=>dkey(r.dt)));
  document.getElementById('imppv').innerHTML=`<div class="card" style="margin-top:10px;box-shadow:none;border:1px solid var(--line)">
    <b>识别成功 ✅</b><div class="small" style="margin-top:4px">共 ${parsed.length} 条，覆盖 ${days.size} 天。其中新记录 <b>${fresh.length}</b> 条（已自动跳过 ${parsed.length-fresh.length} 条重复）。</div>
    <div class="small muted" style="margin-top:6px">${Object.entries(cnt).map(([k,v])=>`${(RTYPES[k]||RTYPES.other).i}${(RTYPES[k]||RTYPES.other).n} ${v}`).join(' · ')}</div>
    <button class="btn" style="margin-top:10px" onclick="confirmImport()">确认导入 ${fresh.length} 条</button></div>`;
}
function confirmImport(){if(!pendingImport)return;pendingImport.forEach(r=>{r.id=uid();DB.records.push(r);});save();pendingImport=null;closeSheet();renderRec();renderHeader();
  alert('导入完成 🎉');}

/* ============ 导出/备份 ============ */
function download(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function exportJSON(){download(`悠悠成长备份_${todayStr()}.json`,JSON.stringify(DB,null,2),'application/json');}
function exportCSV(){const rows=[['日期时间','类型','奶量ml','母乳左分','母乳右分','辅食','睡眠分','体重kg','身高cm','备注']];
  DB.records.slice().sort((a,b)=>a.dt.localeCompare(b.dt)).forEach(r=>rows.push([r.dt,(RTYPES[r.type]||RTYPES.other).n,r.ml||'',r.leftMin||'',r.rightMin||'',r.food||'',r.durationMin||'',r.weightKg||'',r.heightCm||'',(r.note||'').replace(/,/g,'，')]));
  download(`悠悠记录_${todayStr()}.csv`,'﻿'+rows.map(r=>r.join(',')).join('\n'),'text/csv');}
function restoreBackup(d){if(!d||!d.profile){alert('不是有效备份文件');return;}
  if(confirm('恢复备份将覆盖当前所有数据，确定？')){DB=d;DB.skills=DB.skills||{};DB.records=DB.records||[];DB.pref=DB.pref||{wake:'07:00'};save();closeSheet();renderHeader();go(CUR);alert('已恢复 ✅');}}

   <label class="fld"><span>出生日期</span><input type="date" id="s_birth" value="${DB.profile.birth||''}"></label>

   <h3 style="font-size:14px">数据</h3>
   <div class="row"><button class="btn sm sec" onclick="exportJSON()">导出备份</button>
    <button class="btn sm sec" onclick="importSheet()">导入/恢复</button>

}
function resetAll(){if(confirm('确定清空全部数据（含记录与技能树标记）？建议先导出备份。')){localStorage.removeItem(LS);DB=load();save();closeSheet();renderHeader();go('day');}}
