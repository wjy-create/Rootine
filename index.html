<meta name="theme-color" content="#8b6fd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#fbf7f3; --card:#ffffff; --ink:#3d3a4e; --muted:#8b8798; --line:#efe7df;
  --p1:#7c5cc4; --p1b:#f0e9fb; /* 粗大运动 紫 */
  --p2:#d94f7a; --p2b:#fbe6ee; /* 精细动作 粉红 */
  --p3:#3a9d6a; --p3b:#e3f4ea; /* 感知觉 绿 */
  --p4:#3b82c4; --p4b:#e4eefb; /* 认知 蓝 */
  --warm:#f6a04d; --warmb:#fdeedd;
  --sleep:#6c7bd0; --feed:#e08a3c; --play:#3a9d6a; --care:#c46aa0; --out:#46a8b8;
  --ok:#3a9d6a; --doing:#f0a836; --todo:#cfc8d6;
  --shadow:0 2px 14px rgba(120,90,160,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
h1,h2,h3,h4{margin:0;font-weight:700}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 90px}
/* header */
.top{background:linear-gradient(135deg,#8b6fd0,#c46aa0);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(140,90,170,.2)}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.babyface{width:44px;height:44px;border-radius:50%;background:#fff3;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.top h1{font-size:18px}
.brand{font-size:10.5px;font-weight:800;letter-spacing:2px;opacity:.92;margin-bottom:1px}
.top .sub{font-size:12.5px;opacity:.9;margin-top:1px}
.top .gear{margin-left:auto;font-size:20px;opacity:.95;background:#ffffff22;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
/* tabs */
.tabs{display:flex;background:var(--card);position:sticky;top:78px;z-index:19;box-shadow:var(--shadow);border-radius:0 0 16px 16px;max-width:880px;margin:0 auto;overflow:hidden}
.tabs button{flex:1;padding:9px 1px 7px;font-size:11px;color:var(--muted);border-bottom:3px solid transparent;transition:.15s}
.tabs button .ic{display:block;font-size:17px;margin-bottom:1px}
.tabs button.on{color:var(--p1);border-bottom-color:var(--p1);font-weight:600}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-top:14px}
.card h2{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--p1);color:#fff;padding:9px 15px;border-radius:10px;font-size:14px;font-weight:600}
.btn.sec{background:var(--p1b);color:var(--p1)}
.btn.ghost{background:#f3eef8;color:var(--muted)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
label.fld{display:block;margin:8px 0}
label.fld span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.divider{height:1px;background:var(--line);margin:14px 0}
/* schedule timeline */
.bandbar{display:flex;align-items:center;gap:10px;background:var(--warmb);border-radius:12px;padding:10px 13px;margin-bottom:6px;flex-wrap:wrap}
.bandbar b{color:var(--warm)}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin:12px 0}
.tgt{background:#faf7fc;border:1px solid var(--line);border-radius:12px;padding:10px}
.tgt .t{font-size:12px;color:var(--muted)}
.tgt .v{font-size:14px;font-weight:700;margin-top:2px}
.tl{position:relative;margin-top:6px;padding-left:8px}
.ev{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:none}
.ev .tm{width:50px;flex-shrink:0;font-weight:700;font-size:13.5px;color:var(--ink)}
.ev .dot{width:30px;flex-shrink:0;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px}
.ev .bd{flex:1;min-width:0}
.ev .bd .ti{font-weight:600;font-size:14px}
.ev .bd .de{font-size:12.7px;color:var(--muted);margin-top:1px}
.k-sleep{background:#e7e9f7;color:var(--sleep)}.k-feed{background:#fbe9d6;color:var(--feed)}
.k-play{background:#e0f1e7;color:var(--play)}.k-meal{background:#fbe9d6;color:var(--feed)}
.k-care{background:#f7e6f0;color:var(--care)}.k-out{background:#dcf0f3;color:var(--out)}.k-wake{background:#fff0d6;color:var(--warm)}
.skref{display:inline-block;margin-top:4px;font-size:11.5px;background:#f0e9fb;color:var(--p1);padding:2px 8px;border-radius:14px;cursor:pointer}
/* skill tree */
.dimtabs{display:flex;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.dimtabs button{padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;background:#f1ecf6;color:var(--muted)}
.dimtabs button.on{color:#fff}
.prog{height:9px;background:#eee;border-radius:6px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;border-radius:6px}
.bandgrp{margin-top:14px}
.bandgrp .bh{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.bandgrp .bh .cur{background:var(--warm);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:10px}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.node{border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;cursor:pointer;transition:.12s;position:relative}
.node .nt{font-size:13px;font-weight:600;line-height:1.35}
.node .nc{font-size:10.5px;color:var(--muted);margin-top:2px}
.node .nn{font-size:11px;color:var(--p1);margin-top:4px;display:none}
.node.has-note .nn{display:block}
.node[data-s="done"]{border-color:var(--ok);background:#f1faf4}
.node[data-s="doing"]{border-color:var(--doing);background:#fff8ec}
.node .mk{position:absolute;top:6px;right:7px;font-size:13px}
/* records */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.seg button{padding:6px 12px;border-radius:18px;font-size:12.5px;background:#f1ecf6;color:var(--muted);font-weight:600}
.seg button.on{background:var(--p1);color:#fff}
.daygrp{margin-top:14px}
.daygrp .dh{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;padding-bottom:5px;border-bottom:2px solid var(--line)}
.daygrp .dh .sum{font-size:11.5px;color:var(--muted);font-weight:500}
.rec{display:flex;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
.rec .rt{width:48px;font-weight:700;font-size:13px;color:var(--muted)}
.rec .ri{width:26px;text-align:center;font-size:15px}
.rec .rc{flex:1;font-size:13.5px}
.rec .rc small{color:var(--muted)}
.rec .del{color:var(--p2);font-size:12px;opacity:.6}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
.empty .big{font-size:34px;display:block;margin-bottom:6px}
/* modal */
.mask{position:fixed;inset:0;background:#3d3a4e88;z-index:40;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px 26px;max-height:88vh;overflow:auto;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between}
.sheet .x{color:var(--muted);font-size:20px}
.note-warn{background:var(--warmb);color:#9a6520;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:8px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:22px;line-height:1.7}
/* v2: 生长 + 辅食 */
.gctrl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.gctrl button{padding:6px 12px;border-radius:18px;font-size:12.5px;background:#f1ecf6;color:var(--muted);font-weight:600}
.gctrl button.on{background:var(--p4);color:#fff}
.gstat{background:#f4f8fc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.gstat b{color:var(--p4)}
.chart{width:100%;height:auto;margin-top:8px;overflow:visible}
.foodtbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.foodtbl td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.foodtbl td:first-child{color:var(--muted);width:32%;background:#faf7fc;white-space:nowrap}
.recipe{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:9px;background:#fffdfb}
.recipe h4{font-size:14px;color:var(--p2);display:flex;align-items:center;gap:6px}
.recipe .ing{font-size:12.5px;color:var(--muted);margin:4px 0 6px}
.recipe ol{margin:0;padding-left:18px;font-size:13px}
.recipe ol li{margin:2px 0}
.foodchip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;font-size:12.5px;margin:4px 5px 0 0;background:#eef6f0;color:var(--p3);cursor:pointer}
.foodchip.allergy{background:#fbe6ee;color:var(--p2)}
.plan{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px;table-layout:fixed}
.plan th,.plan td{border:1px solid var(--line);padding:5px 4px;text-align:center;word-break:break-all}
.plan th{background:#faf7fc;color:var(--muted);font-weight:600}
.plan td.meal{cursor:pointer}
.subh{font-weight:700;font-size:13.5px;margin:14px 0 2px;color:var(--ink)}
.evchk{align-self:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);color:var(--p3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;cursor:pointer}
.evchk.on{background:var(--p3);border-color:var(--p3);color:#fff}
.qbar{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;-webkit-overflow-scrolling:touch}
.qbar button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);background:#f7f3fb;border-radius:12px;padding:7px 8px;min-width:50px}
.qbar .qi{font-size:18px}
.tpre{padding:7px 0;flex:1;border-radius:14px;font-size:12.5px;font-weight:600;background:#f1ecf6;color:var(--muted)}
.tpre.on{background:var(--p2);color:#fff}
.tbig{font-size:30px;font-weight:800;letter-spacing:1px;margin:4px 0;font-variant-numeric:tabular-nums}
.tcol{flex:1}
.ev.evnext{background:#fff7ee;border-radius:10px;margin:0 -6px;padding:9px 6px}
.tm.prop{color:var(--muted)}
.tm .propx{display:block;font-size:9px;background:#efe7df;color:#a99;padding:0 4px;border-radius:5px;margin-top:1px;text-align:center}
.nextlbl{font-size:10px;background:var(--warm);color:#fff;padding:1px 6px;border-radius:8px;font-weight:600}
.cbtn{align-self:center;flex-shrink:0;background:var(--p1);color:#fff;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:14px}
.evrm{align-self:center;flex-shrink:0;color:var(--p2);font-size:13px;opacity:.55;width:26px;text-align:center;cursor:pointer}
@media(min-width:560px){.sheet{border-radius:20px;margin-bottom:auto;margin-top:auto}.mask{align-items:center}}
</style>

function recHash(r){const rest={};Object.keys(r).sort().forEach(k=>{if(k!=='id'&&k[0]!=='_')rest[k]=r[k];});return JSON.stringify(rest);}
function recToRow(r){const data={};Object.keys(r).forEach(k=>{if(k!=='id'&&k!=='dt'&&k!=='type'&&k[0]!=='_')data[k]=r[k];});
  return {family_id:CLOUD.family_id,baby_id:CLOUD.baby_id,client_id:r.id,type:r.type,start_at:new Date(r.dt).toISOString(),data,recorded_by:CLOUD.member_id,updated_at:new Date().toISOString(),deleted:false};}
function rowToRec(w){const d=new Date(w.start_at);
  const dt=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  return Object.assign({id:w.client_id||w.id,dt,type:w.type,_by:w.recorded_by||null},w.data||{});}

async function startSync(){
  cloudState('busy','同步中…');
  try{
    if(!CLOUD.invite_code||!CLOUD.family_name){const {data:f}=await sb.from('families').select('name,invite_code').eq('id',CLOUD.family_id).single();
      if(f){CLOUD.invite_code=f.invite_code;CLOUD.family_name=f.name;saveCloudMeta();}}
    const {data:ms}=await sb.from('members').select('id,display_name').eq('family_id',CLOUD.family_id);
    MEMBERS={};(ms||[]).forEach(m=>MEMBERS[m.id]=m.display_name);
    /* 拉取设置 */
    const {data:st}=await sb.from('family_settings').select('settings,updated_at').eq('family_id',CLOUD.family_id).single();
    if(st&&st.settings&&Object.keys(st.settings).length){applySettings(st.settings,st.updated_at);}
    /* 拉取记录并合并 */
    const {data:rows,error:re}=await sb.from('records').select('*').eq('family_id',CLOUD.family_id).eq('deleted',false).order('start_at');
    if(re)throw re;
    mergeRows(rows||[],true);
    /* 推送本地变更 */
    diffAndQueue();queueSettings();await flushOutbox();
    subscribeRealtime();
    cloudState(OUTBOX.length?'busy':'ok','已连接 · '+(CLOUD.family_name||'家庭')+' · 我是'+CLOUD.display_name);
  }catch(e){console.warn('sync',e);cloudState('err','同步失败：'+(e.message||e));}
}

function applySettings(s,stamp){
  if(stamp&&stamp===settingsStamp)return;settingsStamp=stamp;
  const cur=JSON.stringify(packSettings());if(JSON.stringify(s)===cur)return;
  APPLYING=true;['profile','skills','logs','foods','mealplan','pref'].forEach(k=>{if(s[k]!==undefined)DB[k]=s[k];});
  localStorage.setItem(LS,JSON.stringify(DB));APPLYING=false;rerender();
}
function mergeRows(rows,full){
  const localById={};DB.records.forEach(r=>localById[r.id]=r);
  const cloudIds={};let changed=false;
  rows.forEach(w=>{const rec=rowToRec(w);cloudIds[rec.id]=1;const h=recHash(rec);const loc=localById[rec.id];
    if(!loc){if(!OUTBOX.some(o=>o.op==='delete'&&o.id===rec.id)){DB.records.push(rec);SYNCED[rec.id]=h;changed=true;}}
    else{const lh=recHash(loc);
      if(lh!==h&&SYNCED[rec.id]===lh){Object.keys(loc).forEach(k=>delete loc[k]);Object.assign(loc,rec);SYNCED[rec.id]=h;changed=true;}
      else if(lh===h)SYNCED[rec.id]=h;}});
  if(full){DB.records=DB.records.filter(r=>{if(SYNCED[r.id]&&!cloudIds[r.id]&&!OUTBOX.some(o=>o.id===r.id&&o.op==='upsert')){delete SYNCED[r.id];changed=true;return false;}return true;});}
  if(changed){DB.records.sort((a,b)=>a.dt<b.dt?-1:1);APPLYING=true;localStorage.setItem(LS,JSON.stringify(DB));APPLYING=false;saveSynced();rerender();}
}
function diffAndQueue(){
  const ids={};
  DB.records.forEach(r=>{ids[r.id]=1;const h=recHash(r);
    if(SYNCED[r.id]!==h){const i=OUTBOX.findIndex(o=>o.id===r.id);const item={op:'upsert',id:r.id,rec:JSON.parse(JSON.stringify(r))};
      if(i>=0)OUTBOX[i]=item;else OUTBOX.push(item);}});
  Object.keys(SYNCED).forEach(id=>{if(!ids[id]){const i=OUTBOX.findIndex(o=>o.id===id);const item={op:'delete',id};
      if(i>=0)OUTBOX[i]=item;else OUTBOX.push(item);}});
  saveOutbox();
}
let settingsQueued=false;
function queueSettings(){settingsQueued=true;}
async function flushOutbox(){
  if(FLUSHING||!sb||!CLOUD)return;FLUSHING=true;
  try{
    while(OUTBOX.length){const o=OUTBOX[0];
      if(o.op==='upsert'){const {error}=await sb.from('records').upsert(recToRow(o.rec),{onConflict:'family_id,client_id'});
        if(error)throw error;SYNCED[o.id]=recHash(o.rec);}
      else{const {error}=await sb.from('records').update({deleted:true,updated_at:new Date().toISOString()}).eq('family_id',CLOUD.family_id).eq('client_id',o.id);
        if(error)throw error;delete SYNCED[o.id];}
      OUTBOX.shift();saveOutbox();saveSynced();}
    if(settingsQueued){settingsQueued=false;const stamp=new Date().toISOString();
      const {error}=await sb.from('family_settings').upsert({family_id:CLOUD.family_id,settings:packSettings(),updated_at:stamp});
      if(error)throw error;settingsStamp=stamp;}
    cloudState('ok','已同步');
  }catch(e){console.warn('flush',e);cloudState('err','待同步 '+OUTBOX.length+' 条（'+(e.message||'离线')+'），恢复网络后自动补传');}
  FLUSHING=false;
}
function cloudOnSave(){if(!sb||!CLOUD||APPLYING)return;diffAndQueue();queueSettings();cloudState('busy','同步中…');
  clearTimeout(flushTimer);flushTimer=setTimeout(flushOutbox,400);}

function subscribeRealtime(){
  sb.channel('fam-'+CLOUD.family_id)
    .on('postgres_changes',{event:'*',schema:'public',table:'records',filter:'family_id=eq.'+CLOUD.family_id},p=>{
      const w=p.new&&p.new.id?p.new:p.old;if(!w)return;
      if(p.new&&p.new.deleted){const id=p.new.client_id;const i=DB.records.findIndex(r=>r.id===id);
        if(i>=0&&!OUTBOX.some(o=>o.id===id)){DB.records.splice(i,1);delete SYNCED[id];APPLYING=true;localStorage.setItem(LS,JSON.stringify(DB));APPLYING=false;saveSynced();rerender();}}
      else if(p.new)mergeRows([p.new],false);})
    .on('postgres_changes',{event:'*',schema:'public',table:'family_settings',filter:'family_id=eq.'+CLOUD.family_id},p=>{
      if(p.new&&p.new.settings)applySettings(p.new.settings,p.new.updated_at);})
    .subscribe();
}

/* ============ 工具 ============ */
function ageInfo(refDate){
  const b=new Date(DB.profile.birth+'T00:00:00');const r=refDate?new Date(refDate+'T00:00:00'):new Date();
  let mo=(r.getFullYear()-b.getFullYear())*12+(r.getMonth()-b.getMonth());let d=r.getDate()-b.getDate();
  if(d<0){mo--;const pm=new Date(r.getFullYear(),r.getMonth(),0).getDate();d+=pm;}
  const totalMonths=mo; return {months:totalMonths,text:Math.floor(mo/12)>0?`${Math.floor(mo/12)}岁${mo%12}个月${d}天`:`${mo}个月${d}天`};
}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function shiftTime(hhmm,deltaMin){const[h,m]=hhmm.split(':').map(Number);let t=h*60+m+deltaMin;t=((t%1440)+1440)%1440;return pad(Math.floor(t/60))+':'+pad(t%60);}
const KICON={sleep:'😴',feed:'🍼',play:'🧸',meal:'🥣',care:'🛁',out:'🌳',wake:'🌅'};

/* ============ 今日（日程+记录合并）· 动态推算引擎 ============ */
let dayDate=todayStr();
function toMin(hhmm){const[h,m]=hhmm.split(':').map(Number);return h*60+m;}
function fmtMin(m){m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
const _chain={};
function buildChain(keyName){
  if(_chain[keyName])return _chain[keyName];
  const raw=ROUTINES[keyName].list;const list=[];
  raw.forEach((it,idx)=>{list.push(it);if(it[1]==='sleep'&&!/夜觉/.test(it[2])){const nx=raw[idx+1];list.push([nx?nx[0]:fmtMin(toMin(it[0])+90),'wake','起床','']);}});
  const res=[];let wake=-1,sleepIdx=-1,feedIdx=-1,prevMin=null;const startMin=toMin(list[0][0]);
  list.forEach((it,i)=>{const t=it[0],k=it[1],ti=it[2];const m=toMin(t);let a='prev',off=0;
    if(i===0){a='start';off=0;}
    else if(k==='wake'){if(sleepIdx>=0){a='sleep';off=m-toMin(list[sleepIdx][0]);}else{a='start';off=m-startMin;}}
    else if(k==='sleep'){if(/夜觉/.test(ti)){a='prev';off=m-prevMin;}else{a='wake';off=wake>=0?m-toMin(list[wake][0]):m-startMin;}}
    else if(k==='meal'){const ref=feedIdx>=0?feedIdx:(wake>=0?wake:0);a=feedIdx>=0?'milk':'wake';off=m-toMin(list[ref][0]);}
    else if(k==='feed'){a='wake';off=wake>=0?m-toMin(list[wake][0]):0;}
    else{a='wake';off=wake>=0?m-toMin(list[wake][0]):m-startMin;}
    res.push({a,off,k,ti,de:it[3]||'',sk:it[4]||''});
    if(k==='wake')wake=i;if(k==='sleep'&&!/夜觉/.test(ti))sleepIdx=i;if(k==='feed')feedIdx=i;prevMin=m;});
  return _chain[keyName]=res;
}
function computeDay(date){
  const months=ageInfo(date).months;const keyName=ageToRoutineKey(months);const chain=buildChain(keyName);
  const lg=DB.logs[date]||{};const act=lg.act||{};
  const startWake=(act[0]&&act[0].t)?toMin(act[0].t):toMin(DB.pref.wake||'07:00');
  let lastWake=startWake,lastSleep=null,lastFeed=null,prev=null;const times=[];
  chain.forEach((c,i)=>{let base;
    if(c.a==='start')base=startWake;else if(c.a==='wake')base=lastWake;
    else if(c.a==='sleep')base=(lastSleep!=null?lastSleep:lastWake);
    else if(c.a==='milk')base=(lastFeed!=null?lastFeed:lastWake);else base=(prev!=null?prev:startWake);
    let min=base+c.off;const done=!!(act[i]&&act[i].t);if(done)min=toMin(act[i].t);
    times.push({a:c.a,off:c.off,k:c.k,ti:c.ti,de:c.de,sk:c.sk,i,min,done,s:done?(act[i].s||''):''});
    if(c.k==='wake')lastWake=min;if(c.k==='sleep'&&!/夜觉/.test(c.ti))lastSleep=min;if(c.k==='feed')lastFeed=min;prev=min;});
  return {times,keyName,months,R:ROUTINES[keyName]};
}
function setWake(v){const lg=DB.logs[dayDate]||(DB.logs[dayDate]={});if(!lg.act)lg.act={};lg.act[0]=Object.assign({},lg.act[0],{t:v,s:'起床'});if(!lg.done)lg.done={};lg.done['wake|'+ROUTINES[ageToRoutineKey(ageInfo(dayDate).months)].list[0][2]]=true;DB.pref.wake=v;save();renderDay();}
function renderDay(){
  const {times,months,R}=computeDay(dayDate);const a=ageInfo(dayDate);const isT=dayDate===todayStr();const nm=nowMin();
  const lg=DB.logs[dayDate]||{};const doneN=times.filter(t=>t.done).length;
  let nextI=-1;if(isT){for(const t of times){if(!t.done&&t.min>=nm-20){nextI=t.i;break;}}}
  if(nextI<0){const f=times.find(t=>!t.done);nextI=f?f.i:-1;}
  let h=`<div class="card"><div class="row" style="justify-content:space-between">
    <h2>📝 记录</h2>
    <div class="row" style="gap:4px;align-items:center">
      <button class="btn sm ghost" onclick="dayDate=shiftDate(dayDate,-1);renderDay()">◀</button>
      <input type="date" value="${dayDate}" style="width:auto" onchange="dayDate=this.value;renderDay()">
      <button class="btn sm ghost" onclick="dayDate=shiftDate(dayDate,1);renderDay()">▶</button>
      ${isT?'':`<button class="btn sm sec" onclick="dayDate=todayStr();renderDay()">今天</button>`}
    </div></div>
   <div class="bandbar"><b>${R.label}</b><span class="small muted">${a.text}</span>
    <label class="small" style="margin-left:auto">起床 <input type="time" value="${(lg.act&&lg.act[0]&&lg.act[0].t)||DB.pref.wake||'07:00'}" style="width:auto;display:inline-block;padding:4px 7px" onchange="setWake(this.value)"></label></div>
   ${daySumLine(dayDate)}
   ${isT?`<div class="row" style="justify-content:space-between;margin:6px 0 2px"><span class="small" style="font-weight:700">今日进度</span><span class="small muted">${doneN}/${times.length}</span></div>
   <div class="prog"><i style="width:${times.length?Math.round(doneN/times.length*100):0}%;background:var(--p3)"></i></div>`:''}
   ${smartGuide()}
   <div class="tl">`;
  const nowMs=Date.now();
  const catsOf=t=>['feed_breast','feed_formula','feed_bottle'].includes(t)?['milk']:t==='feed_solid'?['solid']:t==='diaper_poop'?['poop']:t==='diaper_pee'?['pee']:t==='diaper_both'?['poop','pee']:[];
  const latest={};DB.records.forEach(r=>{if(r.dt>nowDT())return;catsOf(r.type).forEach(c=>{if(!latest[c]||r.dt>latest[c].dt)latest[c]=r;});});
  const markIds={};if(isT)Object.values(latest).forEach(r=>{markIds[r.id]=1;});
  const agoTxt=r=>fmtDurCN(Math.max(1,Math.round((nowMs-new Date(r.dt))/60000)))+'前';
  const usedRids=new Set();Object.values(lg.act||{}).forEach(o=>{if(o&&o.rid)usedRids.add(o.rid);});
  const recCls=r=>(r.type.startsWith('feed')||r.type==='drink'||r.type==='water')?'k-feed':r.type==='sleep'?'k-sleep':(r.type==='growth'||r.type==='temp')?'k-care':'k-out';
  /* 记录条目：睡眠拆为「睡觉」「起床」两条，跨午夜的起床归到当天 */
  const recItems=[];
  DB.records.forEach(r=>{
    if(usedRids.has(r.id))return;
    if(r.type==='sleep'){
      if(dkey(r.dt)===dayDate)recItems.push({kind:'r',min:toMin(dtime(r.dt)),r,role:'sleep'});
      if(r.durationMin){const w=new Date(new Date(r.dt).getTime()+r.durationMin*60000);
        const wd=w.getFullYear()+'-'+pad(w.getMonth()+1)+'-'+pad(w.getDate());
        if(wd===dayDate)recItems.push({kind:'r',min:w.getHours()*60+w.getMinutes(),r,role:'wake',wt:pad(w.getHours())+':'+pad(w.getMinutes())});}
    }else if(dkey(r.dt)===dayDate)recItems.push({kind:'r',min:toMin(dtime(r.dt)),r});
  });
  const showTimes=(dayDate<todayStr())?times.filter(t=>t.done):times;
  const items=showTimes.map(t=>({kind:'s',min:t.min,t})).concat(recItems)
    .sort((x,y)=>x.min-y.min||(x.kind==='s'?-1:1));
  items.forEach(it=>{
    if(it.kind==='s'){const t=it.t;const isNext=t.i===nextI;
      const lr=(t.done&&lg.act&&lg.act[t.i]&&lg.act[t.i].rid)?DB.records.find(x=>x.id===lg.act[t.i].rid):null;
      const sgap=(lr&&markIds[lr.id])?agoTxt(lr):'';
      h+=`<div class="ev${isNext?' evnext':''}"><div class="tm ${t.done?'':'prop'}">${fmtMin(t.min)}${t.done?'':'<span class="propx">建议</span>'}</div>
        <div class="dot k-${t.k}">${KICON[t.k]||'•'}</div>
        <div class="bd"><div class="ti">${t.ti}${isNext?' <span class="nextlbl">下一步</span>':''}</div>${t.de?`<div class="de">${t.de}</div>`:''}
        ${t.done&&t.s?`<div class="de" style="color:var(--p3)">✓ ${t.s}</div>`:''}
        ${sgap?`<div class="de" style="color:#c2647d;font-weight:600">${sgap}</div>`:''}
        ${t.k==='meal'?`<span class="skref" style="background:var(--p3b);color:var(--p3)" onclick="go('food')">🥣 辅食</span>`:''}
        </div>
        ${t.done?`<div class="evchk on" onclick="undoSlot(${t.i})">✓</div>`:`<button class="cbtn" onclick="completeSlot(${t.i})">完成</button>`}</div>`;
    }else{const r=it.r;
      if(it.role==='sleep'){
        h+=`<div class="ev"><div class="tm">${dtime(r.dt)}</div><div class="dot k-sleep">😴</div>
          <div class="bd" onclick="recDetail('${r.id}')" style="cursor:pointer"><div class="ti" style="font-weight:500">睡觉</div>
          ${r.durationMin==null?'<div class="de" style="color:var(--p4)">进行中…</div>':''}</div>
          <div class="evrm" onclick="delRec('${r.id}')">✕</div></div>`;
      }else if(it.role==='wake'){
        h+=`<div class="ev"><div class="tm">${it.wt}</div><div class="dot k-sleep">🌅</div>
          <div class="bd" onclick="recDetail('${r.id}')" style="cursor:pointer"><div class="ti" style="font-weight:500">起床 <span style="color:var(--warm);font-weight:600">${fmtDurCN(r.durationMin)}</span></div></div>
          </div>`;
      }else{const gap=markIds[r.id]?agoTxt(r):'';
        h+=`<div class="ev"><div class="tm">${dtime(r.dt)}</div>
          <div class="dot ${recCls(r)}">${(RTYPES[r.type]||RTYPES.other).i}</div>
          <div class="bd" onclick="recDetail('${r.id}')" style="cursor:pointer"><div class="ti" style="font-weight:500">${recDesc(r)}</div>${gap?`<div class="de" style="color:#c2647d;font-weight:600">${gap}</div>`:''}</div>
          <div class="evrm" onclick="delRec('${r.id}')">✕</div></div>`;
      }
    }
  });
  h+=`</div>
   <label class="fld" style="margin-top:8px"><span>📝 今日小记</span><input type="text" value="${(lg.foodNote||'').replace(/"/g,'&quot;')}" placeholder="例：午餐爱吃；练了爬行和扶站" onchange="setDayNote('${dayDate}',this.value)"></label>
   </div>`;
  h+=dayRecordsHTML(dayDate);
  document.getElementById('view-day').innerHTML=h;
}
function napMinOnDay(day){
  const [nsH,nsM]=(DB.pref.napStart||'06:45').split(':').map(Number);const [neH,neM]=(DB.pref.napEnd||'19:00').split(':').map(Number);
  const w0=new Date(day+'T00:00:00').getTime()+(nsH*60+nsM)*60000;const w1=new Date(day+'T00:00:00').getTime()+(neH*60+neM)*60000;
  let t=0;DB.records.forEach(r=>{if(r.type!=='sleep'||!r.durationMin)return;const st=new Date(r.dt).getTime();const en=st+r.durationMin*60000;
    const ov=Math.min(en,w1)-Math.max(st,w0);if(ov>0)t+=ov/60000;});return Math.round(t);}
function daySumLine(date){
  const recs=DB.records.filter(r=>dkey(r.dt)===date);
  const agg={};recs.forEach(r=>{const a=agg[r.type]=agg[r.type]||{n:0,ml:0,dur:0,l:0,r:0};
    a.n++;a.ml+=r.ml||0;if(r.type!=='sleep')a.dur+=r.durationMin||0;a.l+=r.leftMin||0;a.r+=r.rightMin||0;});
  const sleep=sleepMinOnDay(date),nap=napMinOnDay(date);
  const parts=[];const shown={sleep:1,feed_breast:1,diaper_pee:1,diaper_poop:1,diaper_both:1};
  if(agg.feed_breast)parts.push(`🤱${agg.feed_breast.n}次 ${agg.feed_breast.l}分/${agg.feed_breast.r}分`);
  ['feed_formula','feed_bottle','feed_pump','drink','water'].forEach(t=>{if(agg[t]){shown[t]=1;parts.push(`${RTYPES[t].i}${agg[t].n}次${agg[t].ml?' '+agg[t].ml+'ml':''}`);}});
  ['feed_solid','meal_main','snack'].forEach(t=>{if(agg[t]){shown[t]=1;parts.push(`${RTYPES[t].i}${agg[t].n}次`);}});
  if(sleep)parts.push(`😴${fmtDur(sleep)}`);
  if(nap)parts.push(`<span style="color:var(--warm)">🌞小觉${fmtDur(nap)}</span>`);
  const pee=(agg.diaper_pee?agg.diaper_pee.n:0)+(agg.diaper_both?agg.diaper_both.n:0);
  const poop=(agg.diaper_poop?agg.diaper_poop.n:0)+(agg.diaper_both?agg.diaper_both.n:0);
  if(pee)parts.push(`💦${pee}`);if(poop)parts.push(`💩${poop}`);
  /* 其余所有出现过的活动：散步(含时长)/洗澡/维生素/早教/自定义… */
  Object.keys(RTYPES).forEach(t=>{if(shown[t]||!agg[t])return;const T=RTYPES[t];
    parts.push(`${T.i}${agg[t].n}次${agg[t].dur?' '+fmtDur(agg[t].dur):''}`);});
  const sum=parts.join(' · ');
  const isT=date===todayStr();const open=isT?openSleepRec():null;

function completeSlot(i){

function cFeed(){const t=gv('c_ft');document.getElementById('c_fb').innerHTML=t==='feed_breast'?`<div class="row"><label class="fld" style="flex:1"><span>左(分)</span><input type="number" id="c_l"></label><label class="fld" style="flex:1"><span>右(分)</span><input type="number" id="c_r"></label></div>`:`<label class="fld"><span>奶量 ml</span><input type="number" id="c_ml"></label>`;}
function saveComplete(i){
  const {times}=computeDay(dayDate);const c=times[i];if(!c)return;const dt=gv('c_dt');if(!dt){alert('请选时间');return;}
  const hhmm=dt.slice(11,16);let s=c.ti,rec=null;
  if(c.k==='feed'){const ft=gv('c_ft');if(ft==='feed_breast'){const l=+gv('c_l')||0,r=+gv('c_r')||0;rec={type:'feed_breast',leftMin:l,rightMin:r};s=`母乳 左${l}右${r}`;}else{const ml=+gv('c_ml')||0;rec={type:ft,ml};s=`${RTYPES[ft].n} ${ml}ml`;}}
  else if(c.k==='meal'){const f=gv('c_food');rec={type:'feed_solid',food:f};s=`辅食 ${f||''}`.trim();}
  else if(c.k==='sleep'){
    const o=openSleepRec();
    if(o){s='入睡(已有进行中睡眠)';}
    else{rec={type:'sleep',durationMin:null};s='入睡';}}
  else if(c.k==='wake'){
    const o=openSleepRec();
    if(o){const dur=Math.round((new Date(dayDate+'T'+hhmm).getTime()-new Date(o.dt).getTime())/60000);
      if(dur>0&&dur<1440){o.durationMin=dur;s='起床 · 睡'+fmtDur(dur);}
      else s='起床';}
    else{const ss=findSleepStart(dayDate,i);
      if(ss){const dur=Math.round((new Date(dayDate+'T'+hhmm).getTime()-new Date(ss.iso).getTime())/60000);
        if(dur>0&&dur<1440){rec={type:'sleep',durationMin:dur,dt:ss.iso};s='起床 · 睡'+fmtDur(dur);}else s='起床';}
      else s='起床';}}
  else if(c.k==='out'){const d=+gv('c_dur')||0;if(d)rec={type:'walk',durationMin:d};s=c.ti;}
  else if(c.k==='care'){if(/洗澡/.test(c.ti))rec={type:'bath'};else if(/维/.test(c.ti))rec={type:'vitamin',note:c.ti};s=c.ti;}

  const lg=DB.logs[dayDate]||(DB.logs[dayDate]={});if(!lg.act)lg.act={};lg.act[i]={t:hhmm,s,rid:rec?rec.id:null};if(!lg.done)lg.done={};lg.done[c.k+'|'+c.ti]=true;
  save();closeSheet();renderDay();
}
function undoSlot(i){const lg=DB.logs[dayDate];if(lg){const o=lg.act&&lg.act[i];if(o&&o.rid)DB.records=DB.records.filter(r=>r.id!==o.rid);if(lg.act)delete lg.act[i];const c=computeDay(dayDate).times[i];if(lg.done&&c)delete lg.done[c.k+'|'+c.ti];save();renderDay();}}

function smartGuide(){
  if(dayDate!==todayStr())return'';

}

function importSheet(){
  openSheet(`<h3>⬇️ 导入记录<span class="x" onclick="closeSheet()">×</span></h3>
   <div class="small muted">支持 <b>Piyolog(Piyo日志)</b> 导出的文本(.txt)，自动识别母乳/配方奶/辅食/睡眠/尿布/体重等。也可恢复本工具的 JSON 备份。</div>
   <label class="fld" style="margin-top:10px"><span>① 选择文件</span><input type="file" id="impf" accept=".txt,.json" onchange="impFile(event)"></label>
   <div class="small muted" style="text-align:center;margin:4px 0">— 或 —</div>
   <label class="fld"><span>② 直接粘贴 Piyolog 文本</span><textarea id="imptx" placeholder="把导出内容整段粘贴到这里…"></textarea></label>
   <div id="imppv"></div>
   <div class="row" style="margin-top:10px"><button class="btn" onclick="doImportText()">解析并预览</button><button class="btn ghost" onclick="closeSheet()">取消</button></div>`);
}
function impFile(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const txt=rd.result;
    if(f.name.endsWith('.json')){try{const d=JSON.parse(txt);restoreBackup(d);}catch(err){alert('JSON 解析失败');}return;}
    document.getElementById('imptx').value=txt;doImportText();};
  rd.readAsText(f);}
function parseDur(s){let h=0,m=0;const hm=s.match(/(\d+)\s*(?:小时|時間|时)/);if(hm)h=+hm[1];const mm=s.match(/(\d+)\s*分/);if(mm)m=+mm[1];return h*60+m;}
function toISO(y,mo,d,hh,mm){return `${y}-${pad(mo)}-${pad(d)}T${pad(hh)}:${pad(mm)}`;}
function parsePiyolog(txt){
  const lines=txt.split(/\r?\n/);let cy,cmo,cd;const out=[];
  const dre=/(\d{4})年(\d{1,2})月(\d{1,2})日/;
  const ere=/^(\d{1,2}):(\d{2})\s+(.+)$/;
  for(let raw of lines){
    const line=raw.trim();
    const dm=line.match(dre);if(dm){cy=+dm[1];cmo=+dm[2];cd=+dm[3];continue;}
    if(/共\s/.test(line))continue; // 汇总行
    const em=line.match(ere);if(!em||!cy)continue;
    const hh=+em[1],mm=+em[2],c=em[3].trim();
    const iso=toISO(cy,cmo,cd,hh,mm);let r=null;
    if(c.startsWith('起床')){const dur=parseDur(c);if(dur>0){const end=new Date(cy,cmo-1,cd,hh,mm);const st=new Date(end.getTime()-dur*60000);
        r={dt:toISO(st.getFullYear(),st.getMonth()+1,st.getDate(),st.getHours(),st.getMinutes()),type:'sleep',durationMin:dur};}}
    else if(c.startsWith('睡觉')){r=null;}
    else if(c.startsWith('挤奶')){const m=c.match(/(\d+)\s*ml/i);r={dt:iso,type:'feed_pump',ml:m?+m[1]:0};}
    else if(c.startsWith('瓶喂母乳')||c.startsWith('瓶喂')){const m=c.match(/(\d+)\s*ml/i);r={dt:iso,type:'feed_bottle',ml:m?+m[1]:0};}
    else if(c.startsWith('母乳')){let l=0,rr=0;const lm=c.match(/左\s*(\d+)\s*分/);if(lm)l=+lm[1];const rm=c.match(/右\s*(\d+)\s*分/);if(rm)rr=+rm[1];r={dt:iso,type:'feed_breast',leftMin:l,rightMin:rr};}
    else if(c.startsWith('配方奶')||c.startsWith('奶粉')){const m=c.match(/(\d+)\s*ml/i);r={dt:iso,type:'feed_formula',ml:m?+m[1]:0};}
    else if(c.startsWith('断奶食品')||c.startsWith('辅食')){let food=c.replace(/^断奶食品|^辅食/,'').trim();const m=food.match(/(\d+)\s*ml/i);r={dt:iso,type:'feed_solid',food:food,ml:m?+m[1]:null};}
    else if(c.startsWith('正餐')){r={dt:iso,type:'meal_main',food:c.replace(/^正餐/,'').trim()};}
    else if(c.startsWith('点心')){r={dt:iso,type:'snack',food:c.replace(/^点心/,'').trim()};}
    else if(c.startsWith('饮料')){const m=c.match(/(\d+)\s*ml/i);r={dt:iso,type:'drink',ml:m?+m[1]:0};}
    else if(c.startsWith('喝水')){const m=c.match(/(\d+)\s*ml/i);r={dt:iso,type:'water',ml:m?+m[1]:0};}
    else if(c.includes('维生素')||c.includes('益生菌')||c.includes('VD')||c.includes('AD')){r={dt:iso,type:'vitamin',note:c};}
    else if(c.startsWith('体温')){const m=c.match(/([\d.]+)/);r={dt:iso,type:'temp',tempC:m?+m[1]:null};}
    else if(c.startsWith('头围')){const m=c.match(/([\d.]+)\s*cm/i);r={dt:iso,type:'growth',headCm:m?+m[1]:null};}
    else if(c.startsWith('胸围')){const m=c.match(/([\d.]+)\s*cm/i);r={dt:iso,type:'growth',chestCm:m?+m[1]:null};}
    else if(c.startsWith('脚')){const m=c.match(/([\d.]+)\s*cm/i);r={dt:iso,type:'growth',footCm:m?+m[1]:null};}
    else if(c.startsWith('体重')){const m=c.match(/([\d.]+)\s*kg/i);const note=c.replace(/体重\s*[\d.]+\s*kg/i,'').trim();r={dt:iso,type:'growth',weightKg:m?+m[1]:null,note};}
    else if(c.startsWith('身高')||c.startsWith('身长')){const m=c.match(/([\d.]+)\s*cm/i);r={dt:iso,type:'growth',heightCm:m?+m[1]:null};}
    else if(c.startsWith('散步')||c.startsWith('户外')){r={dt:iso,type:'walk',durationMin:parseDur(c)};}
    else if(c.startsWith('游泳')){r={dt:iso,type:'swim',durationMin:parseDur(c)};}
    else if(c.startsWith('大运动')){r={dt:iso,type:'bigmotor',durationMin:parseDur(c)};}
    else if(c.startsWith('追视')||c.startsWith('追听')){r={dt:iso,type:'track',note:c};}
    else if(c.startsWith('便便')){const n=c.match(/[（(](.+?)[）)]/);r={dt:iso,type:'diaper_poop',note:n?n[1]:''};}
    else if(c.startsWith('尿尿')||c.startsWith('小便')){const n=c.match(/[（(](.+?)[）)]/);r={dt:iso,type:'diaper_pee',note:n?n[1]:''};}
    else if(c.startsWith('洗澡')){r={dt:iso,type:'bath'};}
    else if(c.startsWith('咳嗽')){r={dt:iso,type:'cough',note:c.replace(/^咳嗽/,'').trim()};}
    else if(c.startsWith('呕吐')){r={dt:iso,type:'vomit',note:c.replace(/^呕吐/,'').trim()};}
    else if(c.startsWith('皮疹')){r={dt:iso,type:'rash',note:c.replace(/^皮疹/,'').trim()};}
    else if(c.startsWith('受伤')){r={dt:iso,type:'injury',note:c.replace(/^受伤/,'').trim()};}
    else if(c.startsWith('预防接种')||c.startsWith('疫苗')){r={dt:iso,type:'vaccine',note:c.replace(/^预防接种|^疫苗/,'').trim()};}
    else if(c.startsWith('医院')){r={dt:iso,type:'hospital',note:c.replace(/^医院/,'').trim()};}
    else if(c.startsWith('药')||c.startsWith('用药')){r={dt:iso,type:'med',note:c.replace(/^用?药/,'').trim()};}
    else if(c.startsWith('剪指甲')){r={dt:iso,type:'nail'};}
    else if(c.startsWith('理发')){r={dt:iso,type:'haircut'};}
    else if(c.startsWith('成就')){r={dt:iso,type:'achievement',note:c.replace(/^成就/,'').trim()};}
    if(r)out.push(r);
  }
  return out;
}
let pendingImport=null;
function doImportText(){const txt=document.getElementById('imptx').value;
  if(!txt.trim()){alert('请粘贴内容或选择文件');return;}
  const parsed=parsePiyolog(txt);
  if(!parsed.length){document.getElementById('imppv').innerHTML=`<div class="note-warn">没识别到记录。确认是 Piyolog 导出的文本？</div>`;return;}
  // dedupe against existing
  const sig=r=>[r.dt,r.type,r.ml||'',r.leftMin||'',r.rightMin||'',r.food||'',r.durationMin||'',r.weightKg||''].join('|');
  const have=new Set(DB.records.map(sig));
  const fresh=parsed.filter(r=>!have.has(sig(r)));
  pendingImport=fresh;
  const cnt={};parsed.forEach(r=>cnt[r.type]=(cnt[r.type]||0)+1);
  const days=new Set(parsed.map(r=>dkey(r.dt)));
  document.getElementById('imppv').innerHTML=`<div class="card" style="margin-top:10px;box-shadow:none;border:1px solid var(--line)">
    <b>识别成功 ✅</b><div class="small" style="margin-top:4px">共 ${parsed.length} 条，覆盖 ${days.size} 天。其中新记录 <b>${fresh.length}</b> 条（已自动跳过 ${parsed.length-fresh.length} 条重复）。</div>
    <div class="small muted" style="margin-top:6px">${Object.entries(cnt).map(([k,v])=>`${(RTYPES[k]||RTYPES.other).i}${(RTYPES[k]||RTYPES.other).n} ${v}`).join(' · ')}</div>
    <button class="btn" style="margin-top:10px" onclick="confirmImport()">确认导入 ${fresh.length} 条</button></div>`;
}
function confirmImport(){if(!pendingImport)return;pendingImport.forEach(r=>{r.id=uid();DB.records.push(r);});save();pendingImport=null;closeSheet();renderDay();renderHeader();
  alert('导入完成 🎉');}

/* ============ 导出/备份 ============ */
function download(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function exportJSON(){download(`Rootine备份_${todayStr()}.json`,JSON.stringify(DB,null,2),'application/json');}
function exportCSV(){const rows=[['日期时间','类型','奶量ml','母乳左分','母乳右分','辅食','睡眠分','体重kg','身高cm','备注']];
  DB.records.slice().sort((a,b)=>a.dt.localeCompare(b.dt)).forEach(r=>rows.push([r.dt,(RTYPES[r.type]||RTYPES.other).n,r.ml||'',r.leftMin||'',r.rightMin||'',r.food||'',r.durationMin||'',r.weightKg||'',r.heightCm||'',(r.note||'').replace(/,/g,'，')]));
  download(`Rootine记录_${todayStr()}.csv`,'﻿'+rows.map(r=>r.join(',')).join('\n'),'text/csv');}
function restoreBackup(d){if(!d||!d.profile){alert('不是有效备份文件');return;}
  if(confirm('恢复备份将覆盖当前所有数据，确定？')){DB=d;DB.skills=DB.skills||{};DB.records=DB.records||[];DB.pref=DB.pref||{wake:'07:00'};save();closeSheet();renderHeader();go(CUR);alert('已恢复 ✅');}}

     <button class="${gStd==='cn'?'on':''}" onclick="gStd='cn';renderGrowth()">中国标准</button>

   <div class="small muted">${sex==='boy'?'男宝':'女宝'} · ${cfg.std==='wh'?(gStd==='cn'?'中国 WS/T 423-2022':'WHO 儿童生长标准')+' · 阴影为 P3–P97，虚线为 P50':cfg.std==='hc'?'WHO 头围参考 · 阴影为 P3–P97，虚线为 P50':gMeasure==='chest'?'胸围无官方标准曲线，仅记录趋势':'脚长记录趋势（买鞋参考）'}</div>`;
  if(!ds&&!pts.length){
    h+=`<div class="gstat">还没有${cfg.n}数据。点下方按钮记录后即可看到趋势。</div>
     <div class="row" style="margin-top:10px"><button class="btn sm" onclick="addRec('growth')">＋ 记录测量</button><button class="btn sm sec" onclick="growthList()">📋 测量记录</button></div></div>`;
    document.getElementById('view-growth').innerHTML=h;return;
  }
  // y range
  let yMin=Infinity,yMax=-Infinity;
  if(ds)ds.forEach(r=>{yMin=Math.min(yMin,r[0]);yMax=Math.max(yMax,r[2]);});
  pts.forEach(p=>{yMin=Math.min(yMin,p.v);yMax=Math.max(yMax,p.v);});
  if(yMin===yMax){yMin-=1;yMax+=1;}
  const pad=(yMax-yMin)*0.08;yMin-=pad;yMax+=pad;
  const W=340,H=250,mL=30,mR=8,mT=10,mB=22;
  const px=m=>mL+m/24*(W-mL-mR);
  const py=v=>mT+(yMax-v)/(yMax-yMin)*(H-mT-mB);
  const line=(idx,dash,col,w)=>{let d='';ds.forEach((r,m)=>{d+=(m?'L':'M')+px(m).toFixed(1)+' '+py(r[idx]).toFixed(1)+' ';});return`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?'stroke-dasharray="4 3"':''}/>`;};
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  if(ds){
    let band='M';ds.forEach((r,m)=>{band+=px(m).toFixed(1)+' '+py(r[2]).toFixed(1)+' L';});
    for(let m=ds.length-1;m>=0;m--){band+=px(m).toFixed(1)+' '+py(ds[m][0]).toFixed(1)+' L';}
    band=band.slice(0,-1)+'Z';
    svg+=`<path d="${band}" fill="${cfg.std==='hc'?'#ece7f6':gStd==='cn'?'#e4eefb':'#e3f4ea'}" opacity="0.7"/>`;
    svg+=line(2,false,'#b9c9e8',1)+line(0,false,'#b9c9e8',1)+line(1,true,cfg.std==='hc'?'#7e57c2':gStd==='cn'?'#3b82c4':'#3a9d6a',1.5);
  }
  // y ticks
  const ticks=4;for(let i=0;i<=ticks;i++){const v=yMin+(yMax-yMin)*i/ticks;const y=py(v);svg+=`<line x1="${mL}" y1="${y.toFixed(1)}" x2="${W-mR}" y2="${y.toFixed(1)}" stroke="#f0e7df" stroke-width="0.6"/><text x="2" y="${(y+3).toFixed(1)}" font-size="8" fill="#8b8798">${v.toFixed(gMeasure==='w'?1:0)}</text>`;}
  // x ticks
  [0,3,6,9,12,15,18,21,24].forEach(m=>{svg+=`<text x="${px(m).toFixed(1)}" y="${H-6}" font-size="8" fill="#8b8798" text-anchor="middle">${m}</text>`;});
  svg+=`<text x="${W-mR}" y="${H-6}" font-size="8" fill="#8b8798" text-anchor="end">月龄</text>`;
  // child line+points
  if(pts.length){let d='';pts.forEach((p,i)=>{d+=(i?'L':'M')+px(p.m).toFixed(1)+' '+py(p.v).toFixed(1)+' ';});
    svg+=`<path d="${d}" fill="none" stroke="#e0762e" stroke-width="2"/>`;
    pts.forEach(p=>{svg+=`<circle cx="${px(p.m).toFixed(1)}" cy="${py(p.v).toFixed(1)}" r="3.2" fill="#fff" stroke="#e0762e" stroke-width="2"/>`;});}
  svg+=`</svg>`;
  h+=svg;
  if(pts.length&&ds){const last=pts[pts.length-1];const mi=Math.max(0,Math.min(24,Math.round(last.m)));const pct=estPct(last.v,ds[mi]);
    const lo=ds[mi][0],hi=ds[mi][2];const judge=last.v<lo?'偏低，建议咨询儿保':last.v>hi?'偏高，建议咨询儿保':'在正常范围内 👍';
    h+=`<div class="gstat">最近一次（${mi}月龄）：<b>${last.v}${unit}</b> · ${pct} · ${judge}<div class="small muted" style="margin-top:3px">参考该月龄 P3–P97：${lo}–${hi} ${unit}</div></div>`;
  }else if(pts.length){const last=pts[pts.length-1];
    h+=`<div class="gstat">最近一次（${Math.round(last.m)}月龄）：<b>${last.v}${unit}</b> · 共 ${pts.length} 条记录</div>`;
  }else{
    h+=`<div class="gstat">还没有${cfg.n}数据。在下方记录后即可看到曲线。</div>`;
  }
  h+=`<div class="row" style="margin-top:10px"><button class="btn sm" onclick="addRec('growth')">＋ 记录测量</button><button class="btn sm sec" onclick="growthList()">📋 测量记录</button></div>
   <div class="note-warn">曲线仅供参考，个体差异大；关注趋势是否平稳比单点更重要。异常请咨询儿科/儿保医生。</div></div>`;
  document.getElementById('view-growth').innerHTML=h;
}

function growthList(){
  const rows=DB.records.filter(r=>r.type==='growth'||r.type==='temp').sort((a,b)=>b.dt.localeCompare(a.dt));
  const birth=new Date(DB.profile.birth+'T00:00:00');
  openSheet(`<h3>📋 测量记录<span class="x" onclick="closeSheet()">×</span></h3>
   <div style="max-height:60vh;overflow:auto">`+(rows.length?rows.map(r=>{
    const days=Math.floor((new Date(r.dt)-birth)/86400000);const wk=Math.floor(days/7)+'周'+days%7+'天';
    return `<div class="rec" onclick="recDetail('${r.id}')" style="cursor:pointer"><div class="rt">${r.dt.slice(5,10).replace('-','/')}<br><span class="muted" style="font-size:9px">${wk}</span></div>
     <div class="ri">${r.type==='temp'?'🌡️':'📏'}</div><div class="rc">${recDesc(r)}</div></div>`;}).join(''):'<div class="small muted">暂无测量记录</div>')+`</div>
   <div class="row" style="margin-top:10px"><button class="btn sm" onclick="closeSheet();addRec('growth')">＋ 记录</button><button class="btn sm sec" onclick="closeSheet()">关闭</button></div>`);}

  const curBand=ageToFoodBand(a.months);const F=FOODS[foodBand];
  let h=`<div class="card"><h2>🥣 辅食</h2>
   <div class="small muted" style="margin-bottom:6px">${a.months<6?'宝宝满 6 月后开始添加辅食。以下为各月龄方案，可提前了解。':'按月龄查看食材、喂养量与经典菜谱。'}</div>
   <div class="gctrl">`;
  Object.keys(FOODS).forEach(k=>{h+=`<button class="${k===foodBand?'on':''}" style="${k===foodBand?'background:var(--p2)':''}" onclick="foodBand='${k}';renderFood()">${FOODS[k].label}${k===curBand?' ·当前':''}</button>`;});
  h+=`</div>
   <div class="bandbar" style="background:var(--p2b)"><b style="color:var(--p2)">${F.label}</b><span class="small muted">辅食性状：${F.texture}</span></div>`;
  h+=`<div class="subh">📊 每日喂养量参考</div><table class="foodtbl">${Object.entries(F.amounts).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>`;
  h+=`<div class="subh">✅ 添加原则</div><div class="small">${F.principles.map(p=>'· '+p).join('<br>')}</div>`;
  h+=`<div class="subh">⚠️ 注意事项</div><div class="small">${F.cautions.map(p=>'· '+p).join('<br>')}</div>`;
  h+=`</div>`;
  // 菜谱
  h+=`<div class="card"><h2>👩‍🍳 经典菜谱</h2>`;
  F.recipes.forEach(r=>{h+=`<div class="recipe"><h4>🍲 ${r.n} <span class="foodchip" style="margin:0" onclick="tryFood('${r.n.replace(/'/g,'')}')">+ 标记已吃</span></h4>
     <div class="ing">食材：${r.ing}</div><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;});
  h+=`</div>`;
  // 一周计划
  h+=`<div class="card"><h2>🗓️ 一周辅食计划</h2><div class="row" style="margin-bottom:4px">
     <button class="btn sm" onclick="genPlan()">${DB.mealplan?'换一换':'生成本周计划'}</button>
     <span class="small muted">从「${F.label}」菜谱随机搭配</span></div>`;
  if(DB.mealplan&&DB.mealplan.days){const wk=['一','二','三','四','五','六','日'];
    h+=`<table class="plan"><tr><th>周</th><th>早</th><th>午</th><th>晚</th></tr>`;
    DB.mealplan.days.forEach((d,i)=>{h+=`<tr><th>${wk[i]}</th><td class="meal">${d.早}</td><td class="meal">${d.午}</td><td class="meal">${d.晚}</td></tr>`;});
    h+=`</table><div class="small muted" style="margin-top:5px">另配奶 + 水果加餐。计划基于「${FOODS[DB.mealplan.band]?FOODS[DB.mealplan.band].label:''}」生成。</div>`;
  }else{h+=`<div class="small muted">点上方按钮，自动排出一周早午晚辅食。</div>`;}
  h+=`</div>`;
  // 已吃食材 + 过敏
  h+=`<div class="card"><h2>🍓 已吃食材 / 过敏记录</h2>
   <div class="row" style="margin-bottom:6px">
     <input type="text" id="ff_name" placeholder="食材名，如 蛋黄" style="flex:2;min-width:120px">
     <select id="ff_react" style="flex:1;min-width:90px"><option value="ok">正常</option><option value="allergy">过敏/不适</option></select>
     <button class="btn sm" onclick="addFood()">添加</button>
   </div>`;
  if(DB.foods.length){h+=`<div>`+DB.foods.slice().reverse().map(f=>`<span class="foodchip ${f.reaction==='allergy'?'allergy':''}" onclick="delFood('${f.id}')">${f.reaction==='allergy'?'⚠️':'✓'} ${f.name}<small style="opacity:.7"> ${f.date.slice(5)}</small> ✕</span>`).join('')+`</div>
     <div class="small muted" style="margin-top:6px">点食材可删除。⚠️ 为过敏/不适，请避免再次尝试并咨询医生。</div>`;
  }else{h+=`<div class="small muted">添加每次尝试的新食材，记录有无过敏反应（建议每次只试一种、观察 2~3 天）。</div>`;}
  h+=`</div>`;
  document.getElementById('view-food').innerHTML=h;
}
function genPlan(){const b=ageToFoodBand(ageInfo().months);const rs=FOODS[b].recipes.map(r=>r.n);
  const pk=()=>rs[Math.floor(Math.random()*rs.length)];
  const days=[];for(let i=0;i<7;i++)days.push({早:pk(),午:pk(),晚:pk()});
  DB.mealplan={band:b,days};save();foodBand=b;renderFood();}
function tryFood(n){DB.foods.push({id:uid(),name:n,date:todayStr(),reaction:'ok'});save();renderFood();}
function addFood(){const n=gv('ff_name').trim();if(!n){alert('请输入食材名');return;}
  DB.foods.push({id:uid(),name:n,date:todayStr(),reaction:gv('ff_react')});save();renderFood();}
function delFood(id){DB.foods=DB.foods.filter(f=>f.id!==id);save();renderFood();}

/* ============ v2 打卡 + 周度复盘 ============ */
function dayLog(date){return DB.logs[date]||(DB.logs[date]={done:{},foodNote:''});}
function toggleDone(date,key){const l=dayLog(date);if(!l.done)l.done={};if(l.done[key])delete l.done[key];else l.done[key]=true;save();renderDay();}
function setDayNote(date,v){const l=dayLog(date);l.foodNote=v;save();}
function parseSleepHint(t){const r=t.match(/([\d.]+)\s*[–\-~]\s*([\d.]+)\s*h/);if(r)return Math.round((parseFloat(r[1])+parseFloat(r[2]))/2*60);const s=t.match(/([\d.]+)\s*h/);if(s)return Math.round(parseFloat(s[1])*60);return'';}
function qFeed(){const t=document.getElementById('q_ft').value;document.getElementById('q_fbody').innerHTML=t==='feed_formula'?`<label class="fld"><span>奶量 ml</span><input type="number" id="q_ml" placeholder="如 120"></label>`:`<div class="row"><label class="fld" style="flex:1"><span>左(分)</span><input type="number" id="q_l"></label><label class="fld" style="flex:1"><span>右(分)</span><input type="number" id="q_r"></label></div>`;}
function quickLog(type,title,hhmm,key){const dt=dayDate+'T'+hhmm;let body='';
  if(type==='sleep')body=`<label class="fld"><span>睡眠时长（分钟）</span><input type="number" id="q_dur" value="${parseSleepHint(title)}" placeholder="如 90"></label>`;
  else if(type==='feed')body=`<label class="fld"><span>类型</span><select id="q_ft" onchange="qFeed()"><option value="feed_formula">配方奶</option><option value="feed_breast">母乳</option></select></label><div id="q_fbody"></div>`;
  else body=`<label class="fld"><span>辅食内容（可选）</span><input type="text" id="q_food" placeholder="如 三文鱼南瓜烩饭"></label><label class="fld"><span>量 ml（可选）</span><input type="number" id="q_ml2"></label>`;
  openSheet(`<h3>⚡ 记一笔 · ${title}<span class="x" onclick="closeSheet()">×</span></h3>
    <label class="fld"><span>时间</span><input type="datetime-local" id="q_dt" value="${dt}"></label>${body}
    <div class="row" style="margin-top:10px"><button class="btn" onclick="saveQuick('${type}','${key.replace(/'/g,'')}')">保存记录</button><button class="btn ghost" onclick="closeSheet()">取消</button></div>`);
  if(type==='feed')qFeed();}
function saveQuick(type,key){const dt=gv('q_dt');if(!dt){alert('请选时间');return;}const r={id:uid(),dt};
  if(type==='sleep'){r.type='sleep';r.durationMin=+gv('q_dur')||0;}
  else if(type==='feed'){const ft=gv('q_ft');if(ft==='feed_breast'){r.type='feed_breast';r.leftMin=+gv('q_l')||0;r.rightMin=+gv('q_r')||0;}else{r.type='feed_formula';r.ml=+gv('q_ml')||0;}}
  else{r.type='feed_solid';r.food=gv('q_food');r.ml=+gv('q_ml2')||null;}
  DB.records.push(r);const l=dayLog(dayDate);if(!l.done)l.done={};l.done[key]=true;save();closeSheet();renderDay();}
function shiftDate(ds,delta){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+delta);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayItems(date){const m=ageInfo(date).months;const R=ROUTINES[ageToRoutineKey(m)];
  return {play:R.list.filter(e=>e[1]==='play'),meal:R.list.filter(e=>e[1]==='meal'),out:R.list.filter(e=>e[1]==='out')};}
function doneN(date,arr){const l=DB.logs[date];if(!l||!l.done)return 0;return arr.filter(e=>l.done[e[1]+'|'+e[2]]).length;}
function milkOnDay(date){let ml=0;DB.records.forEach(r=>{if(dkey(r.dt)===date&&r.type==='feed_formula')ml+=r.ml||0;});return ml;}
function skillLabel(id){const p=id.split('_');const dim=DIMS[p[0]];return dim?dim.nodes[+p[1]][1]:id;}
let reviewEnd=null,reviewChart='sleeptime';
function barSVG(days,vals,fmt,title,color){
  const W=340,H=200,mL=8,mR=8,mT=14,mB=26,n=days.length;const max=Math.max(1,...vals);const bw=(W-mL-mR)/n;const wk=['日','一','二','三','四','五','六'];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}"><text x="${mL}" y="10" font-size="9" fill="#8b8798">${title}</text>`;
  days.forEach((d,i)=>{const v=vals[i]||0;const bh=v/max*(H-mT-mB);const x=mL+i*bw+bw*0.18,w=bw*0.64,y=H-mB-bh;const cx=(mL+i*bw+bw/2).toFixed(1);
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="3" fill="${color}" opacity="0.85"/>`;
    if(v)s+=`<text x="${(x+w/2).toFixed(1)}" y="${(y-2).toFixed(1)}" font-size="8" fill="#666" text-anchor="middle">${fmt(v)}</text>`;
    const dt=new Date(d+'T00:00:00');s+=`<text x="${cx}" y="${H-12}" font-size="8" fill="#8b8798" text-anchor="middle">${(+d.slice(8,10))}</text><text x="${cx}" y="${H-3}" font-size="7.5" fill="#b3aebb" text-anchor="middle">周${wk[dt.getDay()]}</text>`;});
  return s+`</svg>`;
}
function sleepBlockSVG(days){
  const W=340,H=250,mL=20,mR=6,mT=6,mB=18,n=days.length,cw=(W-mL-mR)/n;const y=h=>mT+h/24*(H-mT-mB);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  for(let hh=0;hh<=24;hh+=3)s+=`<line x1="${mL}" y1="${y(hh).toFixed(1)}" x2="${W-mR}" y2="${y(hh).toFixed(1)}" stroke="#f0e7df" stroke-width="0.6"/><text x="2" y="${(y(hh)+3).toFixed(1)}" font-size="8" fill="#8b8798">${hh}</text>`;
  days.forEach((d,i)=>{const x=mL+i*cw+cw*0.15,w=cw*0.7,d0=new Date(d+'T00:00:00').getTime(),d1=d0+86400000;
    DB.records.forEach(r=>{if(r.type!=='sleep'||!r.durationMin)return;const st=new Date(r.dt).getTime(),en=st+r.durationMin*60000,os=Math.max(st,d0),oe=Math.min(en,d1);if(oe<=os)return;const sh=(os-d0)/3600000,eh=(oe-d0)/3600000;s+=`<rect x="${x.toFixed(1)}" y="${y(sh).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1,y(eh)-y(sh)).toFixed(1)}" rx="2" fill="#6c7bd0" opacity="0.8"/>`;});
    s+=`<text x="${(mL+i*cw+cw/2).toFixed(1)}" y="${H-5}" font-size="8" fill="#8b8798" text-anchor="middle">${(+d.slice(8,10))}日</text>`;});
  return s+`</svg>`;
}
function reviewCharts(days){
  let h=`<div class="card"><h2>📈 本周趋势</h2>
   <div class="seg">${[['sleeptime','睡眠时段'],['sleepamt','睡眠量'],['feed','喂养量']].map(([k,n])=>`<button class="${reviewChart===k?'on':''}" onclick="reviewChart='${k}';renderReview()">${n}</button>`).join('')}</div>`;
  if(reviewChart==='sleeptime')h+=sleepBlockSVG(days)+`<div class="small muted">每条=当天睡眠时段（含小睡+夜觉，跨夜自动拆分）。</div>`;
  else if(reviewChart==='sleepamt')h+=barSVG(days,days.map(d=>sleepMinOnDay(d)),v=>fmtDur(v),'每日睡眠总时长','#6c7bd0');
  else h+=barSVG(days,days.map(d=>milkOnDay(d)),v=>v+'ml','每日配方奶/瓶喂奶量','#e08a3c')+`<div class="small muted">仅统计配方奶/瓶喂母乳的 ml；亲喂次数见上方明细。</div>`;
  return h+`</div>`;
}
/* ============ 摘要板块（周视图图表，PIYO 式） ============ */
let SUMTAB='feed',SUMVIEW='time',SUMHIDE={};
const SCOL={feed_breast:'#ef8fa3',feed_formula:'#f5a742',feed_bottle:'#cdbf3e',feed_pump:'#cdbf3e',feed_solid:'#9ccc65',drink:'#64b5f6',snack:'#bcaaa4',meal_main:'#90a4ae',diaper_pee:'#4dd0e1',diaper_poop:'#a1887f',diaper_both:'#a1887f',temp:'#ef5350',night:'#7986cb',nap:'#ffb74d'};
function yMin(min,H){return 12+min/1440*(H-46);}
function colGeo(i){const L=26,colW=(360-L-4)/7;return {x:L+i*colW,w:colW,c:L+i*colW+colW/2};}
function svgFrame(days,H,body,counts){
  const L=26,W=360;let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fffdf8;border:1px solid #f0e7da;border-radius:10px">`;
  days.forEach((d,i)=>{const {x,w}=colGeo(i);if(i%2)g+=`<rect x="${x}" y="${yMin(0,H)}" width="${w}" height="${yMin(1440,H)-yMin(0,H)}" fill="#fdf3f5" opacity="0.6"/>`;});
  for(let hh=0;hh<=24;hh+=3){const y=yMin(hh*60,H);g+=`<line x1="${L}" y1="${y}" x2="${W-2}" y2="${y}" stroke="#eee"/><text x="${L-3}" y="${y+2.5}" font-size="7" fill="#999" text-anchor="end">${hh}</text>`;}
  days.forEach((d,i)=>{const {c}=colGeo(i);const dt=new Date(d+'T00:00:00');const wd=dt.getDay();
    g+=`<text x="${c}" y="${H-24}" font-size="7.5" fill="${wd===0?'#e57373':wd===6?'#64b5f6':'#666'}" text-anchor="middle" font-weight="600">${+d.slice(8,10)}日</text>`;});
  (counts||[]).forEach((line,li)=>{days.forEach((d,i)=>{const {c}=colGeo(i);const t=line.vals[i];if(t==null)return;
    g+=`<circle cx="${c-12}" cy="${H-14+li*9-2.5}" r="2.5" fill="${line.col}"/><text x="${c-7}" y="${H-14+li*9}" font-size="7" fill="#666">${t}</text>`;});});
  return g+body+`</svg>`;
}
function sleepSegsOnDay(d){
  const s0=new Date(d+'T00:00:00').getTime(),s1=s0+86400000;const segs=[];
  DB.records.forEach(r=>{if(r.type!=='sleep'||!r.durationMin)return;const st=new Date(r.dt).getTime(),en=st+r.durationMin*60000;
    const a=Math.max(st,s0),b=Math.min(en,s1);if(b>a)segs.push([(a-s0)/60000,(b-s0)/60000]);});
  return segs;
}
function splitNap(seg){
  const [ns,ne]=[(DB.pref.napStart||'06:45'),(DB.pref.napEnd||'19:00')].map(t=>{const[a,b]=t.split(':').map(Number);return a*60+b;});
  const out=[];const[a,b]=seg;
  if(b<=ns||a>=ne)out.push([a,b,'night']);
  else{if(a<ns)out.push([a,ns,'night']);out.push([Math.max(a,ns),Math.min(b,ne),'nap']);if(b>ne)out.push([ne,b,'night']);}
  return out;
}
function summaryHTML(days){
  const tabs=[['feed','🍼喂奶'],['sleep','🌙睡眠'],['excrete','🩲排泄'],['temp','🌡️体温'],['all','ALL']];
  const hasVol={feed:1,sleep:1,excrete:1};
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><h2>📊 摘要</h2>
    <div class="row"><button class="btn sm ghost" onclick="reviewEnd=shiftDate(reviewEnd,-7);renderReview()">◀</button>
    <span class="small muted">${days[0].slice(5).replace('-','月')}日~${days[6].slice(5).replace('-','月')}日</span>
    <button class="btn sm ghost" onclick="reviewEnd=shiftDate(reviewEnd,7);if(reviewEnd>todayStr())reviewEnd=todayStr();renderReview()">▶</button></div></div>
   <div class="seg">${tabs.map(([k,n])=>`<button class="${SUMTAB===k?'on':''}" onclick="SUMTAB='${k}';renderReview()">${n}</button>`).join('')}</div>
   ${hasVol[SUMTAB]?`<div class="seg" style="margin-top:4px"><button class="${SUMVIEW==='time'?'on':''}" onclick="SUMVIEW='time';renderReview()">时间</button><button class="${SUMVIEW==='vol'?'on':''}" onclick="SUMVIEW='vol';renderReview()">量</button></div>`:''}
   ${SUMTAB==='all'?`<div class="row" style="justify-content:flex-end;margin-top:4px"><button class="btn sm ghost" onclick="sumFilterSheet()">过滤</button></div>`:''}
   <div style="margin-top:6px">${sumChart(days)}</div></div>`;
  return h;
}
function sumChart(days){
  const recsOn=d=>DB.records.filter(r=>dkey(r.dt)===d);
  if(SUMTAB==='feed'&&SUMVIEW==='time'){
    let body='';const cB=[],cF=[],cS=[];
    days.forEach((d,i)=>{const {c}=colGeo(i);let nb=0,nf=0,ns=0;
      recsOn(d).forEach(r=>{const col=SCOL[r.type];if(!col||!['feed_breast','feed_formula','feed_bottle','feed_pump','feed_solid','drink'].includes(r.type))return;
        if(r.type==='feed_breast')nb++;else if(r.type==='feed_formula')nf++;else if(r.type==='feed_solid')ns++;
        body+=`<circle cx="${c+(r.type==='feed_breast'?-5:r.type==='feed_formula'?5:0)}" cy="${yMin(toMin(dtime(r.dt)),330)}" r="3.4" fill="${col}" stroke="#fff" stroke-width="0.8"/>`;});
      cB.push(nb||null);cF.push(nf||null);cS.push(ns||null);});
    return svgFrame(days,330,body,[{col:SCOL.feed_breast,vals:cB},{col:SCOL.feed_formula,vals:cF}])
      +`<div class="small muted" style="margin-top:4px"><span style="color:${SCOL.feed_breast}">●</span>母乳 <span style="color:${SCOL.feed_formula}">●</span>配方奶 <span style="color:${SCOL.feed_bottle}">●</span>瓶喂/挤奶 <span style="color:${SCOL.feed_solid}">●</span>辅食 <span style="color:${SCOL.drink}">●</span>饮料</div>`;
  }
  if(SUMTAB==='feed'&&SUMVIEW==='vol'){
    const st=days.map(d=>{let bn=0,lm=0,rm=0,fn=0,fml=0,btn=0,bml=0,sn=0;
      recsOn(d).forEach(r=>{if(r.type==='feed_breast'){bn++;lm+=r.leftMin||0;rm+=r.rightMin||0;}
        if(r.type==='feed_formula'){fn++;fml+=r.ml||0;}if(r.type==='feed_bottle'||r.type==='feed_pump'){btn++;bml+=r.ml||0;}
        if(r.type==='feed_solid')sn++;});
      return {bn,lm,rm,fn,fml,btn,bml,sn};});
    const avg=(arr)=>{const v=arr.filter(x=>x>0);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0;};
    const aBrk=avg(st.map(s=>s.lm+s.rm)),aF=avg(st.map(s=>s.fml)),aB=avg(st.map(s=>s.bml));
    const mx=Math.max(100,...st.map(s=>s.fml+s.bml));
    let bars='';days.forEach((d,i)=>{const {x,w,c}=colGeo(i);const s=st[i];const bw=w*0.55;let y0=296;
      [['fml',SCOL.feed_formula],['bml',SCOL.feed_bottle]].forEach(([k,col])=>{const v=s[k];if(!v)return;const hh=v/mx*250;y0-=hh;
        bars+=`<rect x="${c-bw/2}" y="${y0}" width="${bw}" height="${hh}" rx="3" fill="${col}"/><text x="${c}" y="${y0+hh/2+2.5}" font-size="7" fill="#fff" text-anchor="middle">${v}</text>`;});
      if(s.fml+s.bml)bars+=`<text x="${c}" y="${y0-3}" font-size="7.5" fill="#666" text-anchor="middle" font-weight="700">${s.fml+s.bml}ml</text>`;});
    let g=`<svg viewBox="0 0 360 330" style="width:100%;background:#fffdf8;border:1px solid #f0e7da;border-radius:10px">${bars}`;
    days.forEach((d,i)=>{const {c}=colGeo(i);const dt=new Date(d+'T00:00:00');const wd=dt.getDay();
      g+=`<text x="${c}" y="310" font-size="7.5" fill="${wd===0?'#e57373':wd===6?'#64b5f6':'#666'}" text-anchor="middle" font-weight="600">${+d.slice(8,10)}日</text>`;
      g+=`<text x="${c}" y="320" font-size="6.5" fill="#999" text-anchor="middle">🤱${st[i].bn} ${st[i].lm}/${st[i].rm}分</text>`;
      g+=`<text x="${c}" y="328" font-size="6.5" fill="#999" text-anchor="middle">🍼${st[i].fn}次 🥣${st[i].sn}次</text>`;});
    g+='</svg>';
    return `<div class="row" style="flex-wrap:wrap;gap:4px;margin-bottom:6px">
      <span class="foodchip" style="background:#fdeef2;color:#c2647d">平均亲喂 ${fmtDurCN(aBrk)||'—'}/天</span>
      <span class="foodchip" style="background:#fef3e2;color:#b07b22">平均配方奶 ${aF}ml/天</span>
      <span class="foodchip" style="background:#f7f4dd;color:#8f861f">平均瓶喂 ${aB}ml/天</span></div>`+g;
  }
  if(SUMTAB==='sleep'){
    const tot=days.map(d=>sleepSegsOnDay(d).reduce((a,[s,e])=>a+e-s,0));
    const naps=days.map(d=>napMinOnDay(d));
    const avg=a=>{const v=a.filter(x=>x>0);return v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):0;};
    const badge=`<div class="row" style="flex-wrap:wrap;gap:4px;margin-bottom:6px">
      <span class="foodchip" style="background:#eceffb;color:#5260a8">平均 ${fmtDurCN(avg(tot))||'—'}</span>
      <span class="foodchip" style="background:#fef3e2;color:#b07b22">平均小觉 ${fmtDurCN(avg(naps))||'—'}</span></div>`;
    if(SUMVIEW==='time'){
      let body='';days.forEach((d,i)=>{const {c,w}=colGeo(i);const bw=w*0.62;
        sleepSegsOnDay(d).forEach(seg=>splitNap(seg).forEach(([a,b,k])=>{
          body+=`<rect x="${c-bw/2}" y="${yMin(a,330)}" width="${bw}" height="${Math.max(1.5,yMin(b,330)-yMin(a,330))}" rx="3" fill="${SCOL[k]}" opacity="0.9"/>`;}));});
      return badge+svgFrame(days,330,body,[{col:SCOL.night,vals:tot.map(t=>t?fmtDur(t):null)}]);
    }
    let bars='';const mxs=1440;
    days.forEach((d,i)=>{const {c,w}=colGeo(i);const bw=w*0.55;
      if(tot[i]){const hh=tot[i]/mxs*250;bars+=`<rect x="${c-bw/2}" y="${296-hh}" width="${bw}" height="${hh}" rx="3" fill="${SCOL.night}"/>`;
        if(naps[i]){const nh=naps[i]/mxs*250;bars+=`<rect x="${c-bw/2}" y="${296-nh}" width="${bw}" height="${nh}" rx="3" fill="${SCOL.nap}"/><text x="${c}" y="${296-nh/2+2}" font-size="6.5" fill="#fff" text-anchor="middle">${fmtDur(naps[i])}</text>`;}
        bars+=`<text x="${c}" y="${296-hh-3}" font-size="7" fill="#666" text-anchor="middle" font-weight="700">${fmtDur(tot[i])}</text>`;}});
    let g=`<svg viewBox="0 0 360 316" style="width:100%;background:#fffdf8;border:1px solid #f0e7da;border-radius:10px">${bars}`;
    days.forEach((d,i)=>{const {c}=colGeo(i);g+=`<text x="${c}" y="310" font-size="7.5" fill="#666" text-anchor="middle" font-weight="600">${+d.slice(8,10)}日</text>`;});
    return badge+g+'</svg>';
  }
  if(SUMTAB==='excrete'){
    const cP=[],cO=[];let body='';
    days.forEach((d,i)=>{const {c}=colGeo(i);let np=0,no=0;
      recsOn(d).forEach(r=>{const m=toMin(dtime(r.dt));
        if(r.type==='diaper_pee'||r.type==='diaper_both'){np++;body+=`<rect x="${c-8}" y="${yMin(m,330)-3}" width="6" height="6" rx="1.5" fill="${SCOL.diaper_pee}"/>`;}
        if(r.type==='diaper_poop'||r.type==='diaper_both'){no++;body+=`<rect x="${c+2}" y="${yMin(m,330)-3}" width="6" height="6" rx="1.5" fill="${SCOL.diaper_poop}"/>`;}});
      cP.push(np||null);cO.push(no||null);});
    if(SUMVIEW==='time')return svgFrame(days,330,body,[{col:SCOL.diaper_pee,vals:cP},{col:SCOL.diaper_poop,vals:cO}])
      +`<div class="small muted" style="margin-top:4px"><span style="color:${SCOL.diaper_pee}">■</span>尿尿 <span style="color:${SCOL.diaper_poop}">■</span>便便</div>`;
    const mx=Math.max(5,...cP.map(x=>x||0),...cO.map(x=>x||0));let bars='';
    days.forEach((d,i)=>{const {c,w}=colGeo(i);const bw=w*0.28;
      if(cP[i]){const hh=cP[i]/mx*240;bars+=`<rect x="${c-bw-1}" y="${290-hh}" width="${bw}" height="${hh}" rx="2" fill="${SCOL.diaper_pee}"/><text x="${c-bw/2-1}" y="${290-hh-3}" font-size="7" fill="#666" text-anchor="middle">${cP[i]}</text>`;}
      if(cO[i]){const hh=cO[i]/mx*240;bars+=`<rect x="${c+1}" y="${290-hh}" width="${bw}" height="${hh}" rx="2" fill="${SCOL.diaper_poop}"/><text x="${c+bw/2+1}" y="${290-hh-3}" font-size="7" fill="#666" text-anchor="middle">${cO[i]}</text>`;}});
    let g=`<svg viewBox="0 0 360 310" style="width:100%;background:#fffdf8;border:1px solid #f0e7da;border-radius:10px">${bars}`;
    days.forEach((d,i)=>{const {c}=colGeo(i);g+=`<text x="${c}" y="304" font-size="7.5" fill="#666" text-anchor="middle" font-weight="600">${+d.slice(8,10)}日</text>`;});
    return g+'</svg>';
  }
  if(SUMTAB==='temp'){
    let body='';let any=false;
    days.forEach((d,i)=>{const {c}=colGeo(i);
      recsOn(d).forEach(r=>{if(r.type!=='temp'||!r.tempC)return;any=true;
        const y=292-Math.min(1,Math.max(0,(r.tempC-35)/5))*270;
        body+=`<circle cx="${c}" cy="${y}" r="3.2" fill="${SCOL.temp}"/><text x="${c}" y="${y-5}" font-size="7" fill="#c0392b" text-anchor="middle">${r.tempC}</text>`;});});
    let g=`<svg viewBox="0 0 360 310" style="width:100%;background:#fffdf8;border:1px solid #f0e7da;border-radius:10px">`;
    [35,36,37,38,39,40].forEach(t=>{const y=292-(t-35)/5*270;g+=`<line x1="26" y1="${y}" x2="358" y2="${y}" stroke="${t===37?'#f8c8c8':'#eee'}"/><text x="23" y="${y+2.5}" font-size="7" fill="#999" text-anchor="end">${t}</text>`;});
    g+=body;days.forEach((d,i)=>{const {c}=colGeo(i);g+=`<text x="${c}" y="304" font-size="7.5" fill="#666" text-anchor="middle" font-weight="600">${+d.slice(8,10)}日</text>`;});
    g+='</svg>';
    return any?g:g+`<div class="small muted" style="margin-top:4px">本周没有体温记录</div>`;
  }
  /* ALL */
  let body='';
  days.forEach((d,i)=>{const {c,w}=colGeo(i);const bw=w*0.62;
    if(!SUMHIDE.sleep)sleepSegsOnDay(d).forEach(seg=>splitNap(seg).forEach(([a,b,k])=>{
      body+=`<rect x="${c-bw/2}" y="${yMin(a,330)}" width="${bw}" height="${Math.max(1.5,yMin(b,330)-yMin(a,330))}" rx="3" fill="${SCOL[k]}" opacity="0.35"/>`;}));
    recsOn(d).forEach(r=>{if(r.type==='sleep'||SUMHIDE[r.type])return;const col=SCOL[r.type]||'#9e9e9e';
      body+=`<circle cx="${c}" cy="${yMin(toMin(dtime(r.dt)),330)}" r="3" fill="${col}" stroke="#fff" stroke-width="0.7"/>`;});});
  return svgFrame(days,330,body,[]);
}
function sumFilterSheet(){
  const types={};DB.records.forEach(r=>{types[r.type]=1;});
  const list=Object.keys(types).map(t=>[t,(RTYPES[t]||RTYPES.other)]);
  openSheet(`<h3>过滤<span class="x" onclick="closeSheet()">×</span></h3>
   <div class="row"><button class="btn sm sec" onclick="SUMHIDE={};renderReview();closeSheet()">选择全部</button>
   <button class="btn sm ghost" onclick="sumHideAll()">取消全部</button></div>
   ${list.map(([t,T])=>`<label class="row" style="padding:7px 2px;border-bottom:1px solid #f3ece2;gap:8px">
     <input type="checkbox" ${SUMHIDE[t]?'':'checked'} onchange="if(this.checked)delete SUMHIDE['${t}'];else SUMHIDE['${t}']=1;renderReview()"> ${T.i} ${T.n}</label>`).join('')}
   <div class="row" style="margin-top:10px"><button class="btn" onclick="closeSheet()">完成</button></div>`);
}
function sumHideAll(){DB.records.forEach(r=>{SUMHIDE[r.type]=1;});SUMHIDE.sleep=1;renderReview();closeSheet();}

function renderReview(){
  if(!reviewEnd)reviewEnd=todayStr();
  const days=[];for(let i=6;i>=0;i--)days.push(shiftDate(reviewEnd,-i));
  const start=days[0],end=days[6];
  let eeDone=0,eeTot=0,mealDone=0,mealTot=0,outDone=0,outTot=0,sleepSum=0,sleepDays=0,milkSum=0,milkDays=0;
  days.forEach(d=>{const it=dayItems(d);eeTot+=it.play.length;mealTot+=it.meal.length;outTot+=it.out.length;
    eeDone+=doneN(d,it.play);mealDone+=doneN(d,it.meal);outDone+=doneN(d,it.out);
    const sl=sleepMinOnDay(d);if(sl){sleepSum+=sl;sleepDays++;}const mk=milkOnDay(d);if(mk){milkSum+=mk;milkDays++;}});
  const newFoods=DB.foods.filter(f=>f.date>=start&&f.date<=end);
  const allergy=newFoods.filter(f=>f.reaction==='allergy');
  const skillsAdv=Object.entries(DB.skills).filter(([id,o])=>o.date&&o.date>=start&&o.date<=end&&o.status&&o.status!=='todo').map(([id,o])=>({l:skillLabel(id),s:o.status}));
  const wk=['日','一','二','三','四','五','六'];
  let h=summaryHTML(days);
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><h2>📊 周度复盘</h2></div>
     <div class="small muted">${start.slice(5)} ~ ${end.slice(5)}</div>
     <div class="targets">
       <div class="tgt"><div class="t">早教打卡</div><div class="v">${eeDone}/${eeTot}</div></div>
       <div class="tgt"><div class="t">辅食打卡</div><div class="v">${mealDone}/${mealTot}</div></div>
       <div class="tgt"><div class="t">户外</div><div class="v">${outDone}/${outTot}</div></div>
       <div class="tgt"><div class="t">日均奶量</div><div class="v">${milkDays?Math.round(milkSum/milkDays)+'ml':'—'}</div></div>
       <div class="tgt"><div class="t">日均睡眠</div><div class="v">${sleepDays?fmtDur(Math.round(sleepSum/sleepDays)):'—'}</div></div>
       <div class="tgt"><div class="t">新尝试食材</div><div class="v">${newFoods.length}</div></div>
     </div>
     <table class="plan"><tr><th>日期</th><th>早教</th><th>辅食</th><th>户外</th><th>奶ml</th><th>睡</th></tr>`;
  days.forEach(d=>{const it=dayItems(d);const dt=new Date(d+'T00:00:00');const isT=d===todayStr();
    h+=`<tr${isT?' style="background:#fff7ee"':''}><td>${(+d.slice(8,10))}日<br><span class="muted">周${wk[dt.getDay()]}</span></td>
      <td>${doneN(d,it.play)}/${it.play.length}</td><td>${doneN(d,it.meal)}/${it.meal.length}</td>
      <td>${doneN(d,it.out)}/${it.out.length}</td><td>${milkOnDay(d)||'—'}</td>
      <td>${sleepMinOnDay(d)?fmtDur(sleepMinOnDay(d)):'—'}</td></tr>`;});
  h+=`</table></div>`;
  h+=`<div class="card"><h2>🌳 本周早教进展</h2>`;
  if(skillsAdv.length)h+=`<div>`+skillsAdv.map(s=>`<span class="foodchip" style="background:${s.s==='done'?'#eef6f0':'#fff8ec'};color:${s.s==='done'?'var(--p3)':'#b8801f'}">${s.s==='done'?'✅':'🔸'} ${s.l}</span>`).join('')+`</div>`;
  else h+=`<div class="small muted">本周技能树没有新标记。在「技能」里把"正在练/已掌握"标上，这里就会汇总。</div>`;
  h+=`</div>`;
  h+=`<div class="card"><h2>🍓 本周辅食</h2>`;
  if(newFoods.length){h+=`<div>`+newFoods.map(f=>`<span class="foodchip ${f.reaction==='allergy'?'allergy':''}">${f.reaction==='allergy'?'⚠️':'✓'} ${f.name}</span>`).join('')+`</div>`;
    if(allergy.length)h+=`<div class="note-warn">⚠️ 本周过敏/不适：${allergy.map(f=>f.name).join('、')}，请避免并咨询医生。</div>`;}
  else h+=`<div class="small muted">本周没有新增食材记录（在「辅食」里打卡）。</div>`;
  const notes=days.filter(d=>DB.logs[d]&&DB.logs[d].foodNote).map(d=>`<div class="small" style="margin-top:4px"><b>${(+d.slice(8,10))}日</b>：${DB.logs[d].foodNote}</div>`);
  if(notes.length)h+=`<div style="margin-top:8px"><div class="subh">📝 本周小记</div>${notes.join('')}</div>`;
  h+=`</div>`;
  const cov=eeTot?Math.round(eeDone/eeTot*100):0;
  h+=`<div class="card"><div class="gstat">本周早教打卡 <b>${cov}%</b> · 辅食 ${mealDone}/${mealTot} · 新尝试 ${newFoods.length} 种食材 · 技能新进展 ${skillsAdv.length} 项。${cov>=70?'坚持得很棒，继续保持 🌱':'下周可以多陪宝宝玩几项哦 💪'}</div></div>`;
  document.getElementById('view-review').innerHTML=h;
}

/* ============ 喂奶计时器 ============ */
let TM={l:0,r:0,run:null,runSince:0,first:null,startedAt:null,iv:null,alarm:15,bell:true};
const TM_LS='rootine_timer_v1';
function tmLoad(){try{const t=JSON.parse(localStorage.getItem(TM_LS));if(t){['l','r','run','runSince','first','startedAt','alarm','bell'].forEach(k=>{if(t[k]!==undefined)TM[k]=t[k];});if(TM.run)tmEnsureIv();}}catch(e){}}
function tmPersist(){localStorage.setItem(TM_LS,JSON.stringify({l:TM.l,r:TM.r,run:TM.run,runSince:TM.runSince,first:TM.first,startedAt:TM.startedAt,alarm:TM.alarm,bell:TM.bell}));}
function tmElapsed(side){return Math.floor(TM[side]+(TM.run===side?Math.max(0,(Date.now()-TM.runSince)/1000):0));}
function tmActive(){return !!TM.run||TM.l+TM.r>0;}
function tmFmt(s){return pad(Math.floor(s/60))+':'+pad(s%60);}
function timerHTML(){
  const L=tmElapsed('l'),R=tmElapsed('r');
  return `<h3>⏱ 喂奶计时器<span class="x" onclick="closeTimer()">×</span></h3>
   <div class="row" style="justify-content:space-between"><label class="small">🔔 ${TM.alarm}分提醒 <input type="checkbox" ${TM.bell?'checked':''} onchange="TM.bell=this.checked;tmPersist()"></label>
    <label class="small">记录时间 <select onchange="DB.pref.tmRecAt=this.value;save()" style="width:auto;display:inline-block;padding:2px 6px"><option value="end" ${(DB.pref.tmRecAt||'end')==='end'?'selected':''}>结束时间</option><option value="start" ${DB.pref.tmRecAt==='start'?'selected':''}>开始时间</option></select></label></div>
   <div class="row" style="gap:4px;margin:8px 0">${[5,10,15,20].map(m=>`<button class="tpre ${TM.alarm===m?'on':''}" onclick="TM.alarm=${m};tmPersist();timerRefresh()">${m}分</button>`).join('')}</div>
   <div class="row" style="align-items:stretch;text-align:center;gap:10px">
     <div class="tcol" onclick="tmToggle('l')" style="flex:1;cursor:pointer;background:${TM.run==='l'?'#fdeef2':'#faf6ef'};border:2px solid ${TM.run==='l'?'var(--p1)':'transparent'};border-radius:14px;padding:12px 4px">
       <div class="small muted">左</div><div class="tbig" id="tmL">${tmFmt(L)}</div><div class="small" style="font-weight:700;color:var(--p1)">${TM.run==='l'?'⏸ 暂停':'▶ 开始'}</div></div>
     <div class="tcol" onclick="tmToggle('r')" style="flex:1;cursor:pointer;background:${TM.run==='r'?'#fdeef2':'#faf6ef'};border:2px solid ${TM.run==='r'?'var(--p1)':'transparent'};border-radius:14px;padding:12px 4px">
       <div class="small muted">右</div><div class="tbig" id="tmR">${tmFmt(R)}</div><div class="small" style="font-weight:700;color:var(--p1)">${TM.run==='r'?'⏸ 暂停':'▶ 开始'}</div></div></div>
   ${TM.startedAt?`<div class="small muted" style="text-align:center;margin-top:6px">本次 ${dtime(TM.startedAt)} 开始${TM.first?` · ${TM.first==='l'?'从左边':'从右边'}`:''}</div>`:''}
   <div class="small muted" style="text-align:center;margin-top:2px">关闭此窗口计时不会停，可随时回来继续；刷新/锁屏也不丢。</div>
   <div class="row" style="margin-top:12px;justify-content:center"><button class="btn" onclick="tmSave()">📝 保存为母乳记录</button>
    <button class="btn ghost sm" onclick="tmReset()">清零</button></div>`;
}
function feedTimer(){openSheet(timerHTML());tmEnsureIv();}
function timerRefresh(){const s=document.getElementById('sheet');if(s&&/喂奶计时器/.test(s.innerHTML))s.innerHTML=timerHTML();}
function tmEnsureIv(){if(!TM.iv)TM.iv=setInterval(tmTick,1000);}
function tmToggle(side){
  if(TM.run===side){TM[side]=tmElapsed(side);TM.run=null;}
  else{if(TM.run)TM[TM.run]=tmElapsed(TM.run);TM.run=side;TM.runSince=Date.now();
    if(!TM.first)TM.first=side;if(!TM.startedAt)TM.startedAt=nowDT();tmEnsureIv();}
  tmPersist();timerRefresh();}
function tmTick(){if(!TM.run)return;const s=tmElapsed(TM.run);
  const e=document.getElementById(TM.run==='l'?'tmL':'tmR');if(e)e.textContent=tmFmt(s);
  if(TM.alarm&&TM.bell&&s===TM.alarm*60)beep();}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;o.start();g.gain.setValueAtTime(0.25,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.7);o.stop(a.currentTime+0.7);}catch(e){}}
function tmReset(){TM.run=null;TM.l=0;TM.r=0;TM.first=null;TM.startedAt=null;tmPersist();timerRefresh();}
function tmSave(){if(TM.run){TM[TM.run]=tmElapsed(TM.run);TM.run=null;}
  const l=Math.round(TM.l/60),r=Math.round(TM.r/60);
  if(!l&&!r){alert('还没有计时');return;}
  const dt=((DB.pref.tmRecAt||'end')==='start'&&TM.startedAt)?TM.startedAt:nowDT();
  const rec={id:uid(),dt,type:'feed_breast',leftMin:l,rightMin:r,_by:CLOUD?CLOUD.member_id:null};
  if(TM.first)rec.order=TM.first==='l'?'从左边':'从右边';
  DB.records.push(rec);save();tmReset();closeSheet();rerender();alert(`已保存母乳记录 🍼 左${l}分 右${r}分`);}
function closeTimer(){closeSheet();}
tmLoad();

/* ============ 启动 ============ */
syncCustomTypes();applyPrefUI();renderHeader();renderDay();initCloud();
</script>

if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
