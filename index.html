<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rootine</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
  background:#fbf7f3;color:#3d3a4e;padding:24px}
.box{max-width:420px;width:100%;text-align:center}
h1{font-size:20px;margin:0 0 6px}
p{color:#8b8798;font-size:14px;line-height:1.7;margin:0 0 24px}
a.btn{display:block;padding:14px 18px;margin:10px 0;border-radius:14px;text-decoration:none;
  background:linear-gradient(135deg,#8b6fd0,#c46aa0);color:#fff;font-weight:700;
  box-shadow:0 2px 14px rgba(120,90,160,.18)}
a.sub{display:block;padding:12px 18px;margin:10px 0;border-radius:14px;text-decoration:none;
  background:#fff;color:#8b8798;border:1px solid #efe7df;font-size:14px}
.hint{font-size:12px;color:#b3aec0;margin-top:20px;line-height:1.7}
</style>
<script>
// 带 token 直接进状态牌，token 原样透传（不落地、不写进仓库）
(function(){
  var s = location.search;
  if (s && s.indexOf('token=') > -1) location.replace('board.html' + s + location.hash);
})();
</script>
</head>
<body>
<div class="box">
  <h1>🌱 Rootine</h1>
  <p>这个网址需要带访问令牌才能看到记录。<br>请用手机主屏上那个带 token 的书签打开。</p>
  <a class="btn" href="board.html">悠悠 · 记录（需要 token）</a>
  <a class="sub" href="legacy.html">老版 Rootine · 技能树 / 辅食 / 生长</a>
  <p class="hint">老版数据存在本机浏览器里，没有上云，换设备看不到。<br>日常记录请用上面那个「悠悠 · 记录」。</p>
</div>
</body>
</html>
