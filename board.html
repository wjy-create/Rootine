*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#sumbar{background:#fff;border-bottom:1px solid var(--line);padding:7px 12px 6px;color:var(--ink)}
.sumwrap{display:flex;flex-wrap:wrap;gap:5px 14px;align-items:center}
.sumit{color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.sumit .s2{font-size:11px;line-height:1.45}

.sumit .pic{width:30px;height:30px;margin:0}
.sumit .pic.img img{width:30px;height:30px}

.card .ck{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);margin-bottom:6px}
.card .ck .pic{width:26px;height:26px;margin:0}
.card .ck .pic.img img{width:26px;height:26px}
.card .cv{font-size:19px;font-weight:600;line-height:1.4;text-wrap:pretty}
.card .cv b{color:var(--pink)}
.card .cs{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.6;text-wrap:pretty}
#subtabs{background:var(--pinkbg);display:none;padding:0 10px}
.stab{border:none;background:none;color:rgba(255,255,255,.85);font-size:14px;font-weight:600;padding:7px 14px;border-radius:10px 10px 0 0}
.stab.on{background:#fff;color:var(--pink)}
#fresh{background:#fff;padding:2px 12px 6px;font-size:10.5px;color:var(--sub);line-height:1.5;text-wrap:pretty}

#main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
#tl{background:#fff;margin:8px 8px 16px;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}

.pic{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pic svg{width:20px;height:20px;display:block}

.row .mid{flex:1;min-width:0;padding-top:3px}
.row .l1{font-size:16px;line-height:1.45}
.row .l1 .nm{font-weight:400}
.row .l1 .pk{color:var(--pink);font-weight:500;margin-left:9px}
.row .l2{font-size:12.5px;color:var(--sub);line-height:1.5;text-wrap:pretty}
.row .qt{font-size:11.5px;color:#b8b0a5;line-height:1.5;text-wrap:pretty}
.row .gap{font-size:11.5px;color:var(--pink);opacity:.85;line-height:1.7}
.by{flex:none;font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--pinklite);color:var(--pink);white-space:nowrap;margin-top:7px}

.empty{padding:36px 20px;text-align:center;color:var(--sub);font-size:14px}
#err{display:none;margin:10px 14px;color:#b3452f;font-size:13px;text-wrap:pretty}

#sumview{display:none;padding:8px 8px 16px}
.ctlrow{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 8px}
.seg2{display:flex;border:1.5px solid var(--pink);border-radius:99px;overflow:hidden}
.seg2 button{border:none;background:#fff;color:var(--pink);font-size:13px;font-weight:600;padding:5px 22px}
.seg2 button.on{background:var(--pink);color:#fff}
#moonBtn{border:none;border-radius:99px;padding:5px 14px;font-size:14px;background:#6f87c9;color:#fff}

#filtBtn{border:1.5px solid var(--pink);background:#fff;color:var(--pink);border-radius:99px;padding:5px 16px;font-size:13px;font-weight:600}

#filtPop label{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:14px;color:var(--ink)}
.avg{display:flex;flex-direction:column;gap:6px;align-items:flex-end;margin:0 4px 8px}
.avg span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:12px}
.avg b{color:var(--pink)}
.avgfloat{position:absolute;top:10px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:3;align-items:flex-end}
.avgfloat span{background:rgba(255,255,255,.95);border-radius:8px;padding:3px 9px;font-size:11.5px;white-space:nowrap}
.avgfloat .an{border:1.5px solid var(--night);color:#4a5f9e}
.avgfloat .ap{border:1.5px solid var(--nap);color:#a8632c}
.sbar{position:absolute;bottom:0;left:8%;width:68%}
.sblue{position:absolute;inset:0;background:var(--night);border-radius:8px 8px 0 0}
.sorange{position:absolute;bottom:0;left:16%;width:100%;background:var(--nap);border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#fff;text-align:center;line-height:1.45;text-shadow:0 0 2px rgba(0,0,0,.2)}
.gridwrap{position:relative;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:6px 4px 4px 26px;overflow:hidden}
.grid{position:relative;display:flex}
.stripe{position:absolute;top:0;bottom:0;background:#fdf3f7;z-index:0;pointer-events:none}
.hline{position:absolute;left:0;right:0;border-top:1px dashed #e8e2db;pointer-events:none;z-index:1}
.hline.h3{border-top:1px solid #ddd5cc}
.hlab{position:absolute;left:-22px;top:-7px;font-size:10px;color:var(--sub);width:18px;text-align:right}
.col{flex:1;position:relative;border-left:1px solid rgba(0,0,0,.04);z-index:2}
.blk{position:absolute;left:8%;width:84%;border-radius:6px;opacity:.5}
.dot{position:absolute;width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 0 0 .5px rgba(0,0,0,.12);margin-left:-5px}
.dot.sq{border-radius:2.5px}
.dot.dia{border-radius:2px;transform:rotate(45deg)}
.dot.star{background:none!important;border:none;box-shadow:none;font-size:12px;line-height:11px;color:#f2b41c;width:auto;height:auto}
.daylabs{display:flex;padding:4px 4px 2px 26px}
.daylab{flex:1;text-align:center;font-size:10.5px;color:var(--sub);line-height:1.5}
.daylab.sat{color:#5b8dd8}.daylab.sun{color:#e05c5c}
.daylab .cnt{font-size:10px;text-wrap:pretty}
.daylab .cnt b{font-weight:600;color:var(--ink)}
.qtable{background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:8px 4px;margin-bottom:8px}
.qrow{display:flex;border-bottom:1px solid var(--line);align-items:stretch}
.qrow:last-child{border-bottom:none}
.qic{width:30px;flex:none;display:flex;align-items:center;justify-content:center}

.qcell b{color:var(--pink);font-weight:600}
.bars{background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:14px 4px 6px 8px;display:flex;align-items:flex-end;min-height:280px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bartot{font-size:10.5px;font-weight:700;margin-bottom:3px}
.bar{width:72%;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden}
.bseg{width:100%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.25);border-top:1px solid rgba(255,255,255,.55)}
.legend{display:flex;gap:14px;justify-content:center;padding:8px 0 2px;font-size:11px;color:var(--sub)}
.lg{display:flex;align-items:center;gap:4px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:none;background:none;padding:13px 0 11px;font-size:14px;color:var(--sub);letter-spacing:1px}
.tab.on{color:var(--pink);font-weight:700}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(58,53,50,.92);color:#fff;font-size:13px;padding:8px 16px;border-radius:99px;display:none;z-index:40;white-space:nowrap}
#sheetbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
#sheet{display:none;position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));background:#fff;border-radius:16px;z-index:31;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.shhead{padding:12px 16px;font-size:12.5px;color:var(--sub);border-bottom:1px solid var(--line);text-wrap:pretty}
.shbtn{display:block;width:100%;padding:15px;border:none;background:none;font-size:16px;color:var(--ink);border-bottom:1px solid var(--line)}
.shbtn:last-child{border-bottom:none}
.shbtn.danger{color:#e05c5c}
/* 技能树 */
#skillview{display:none;padding:10px 10px 16px}
.dimtabs{display:flex;gap:6px;margin:2px 2px 10px;flex-wrap:wrap}
.dimtabs button{border:none;border-radius:99px;padding:7px 13px;font-size:13px;background:#fff;color:var(--sub);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.dimtabs button.on{color:#fff}
.prog{height:8px;background:#eee8e2;border-radius:99px;overflow:hidden;margin:6px 2px 4px}
.prog i{display:block;height:100%;border-radius:99px}
.progtxt{font-size:11.5px;color:var(--sub);margin:0 2px 4px}
.bandgrp{background:#fff;border-radius:14px;margin:10px 0;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.bh{font-size:13px;font-weight:700;margin-bottom:9px}
.bh .cur{font-size:10px;color:#fff;background:var(--pink);border-radius:99px;padding:2px 8px;margin-left:8px;font-weight:600}
.nodes{display:flex;flex-wrap:wrap;gap:8px}
.node{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;background:#faf8f6;color:var(--ink);display:flex;align-items:center;gap:5px}

.node .np{font-size:10px;opacity:.7;padding-left:2px}
.nn{width:100%;font-size:11px;color:var(--sub);margin-top:3px;text-wrap:pretty}

function pad(n){return (n<10?'0':'')+n}
function bj(ts){return new Date(new Date(ts).getTime()+8*3600e3)}
function fmtT(ms){var d=bj(ms);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())}
function bjDateStr(ms){var d=bj(ms);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function todayStr(){return bjDateStr(Date.now())}
function ymdUtc(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])}
function shiftDate(s,n){var d=new Date(ymdUtc(s)+n*86400e3);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function mondayOf(s){var dow=new Date(ymdUtc(s)).getUTCDay();return shiftDate(s,-((dow+6)%7))}
function dayStartMs(s){return ymdUtc(s)-8*3600e3}
function durTxt(min){min=Math.round(min);var h=Math.floor(min/60),m=min%60;return (h?h+'小时':'')+(m||!h?m+'分钟':'')}
function durTxt5(min){return durTxt(Math.floor(min/5)*5)}
function ago(ms){var m=Math.max(0,Math.round((Date.now()-ms)/60000));if(m<60)return m+'分钟前';return Math.floor(m/60)+'小时'+(m%60)+'分钟前'}
function ago5(ms){var m=Math.max(0,Math.floor((Date.now()-ms)/60000/5)*5);return durTxt(m)}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function weekAge(dateStr){if(!BIRTH)return '';var days=Math.floor((ymdUtc(dateStr)-ymdUtc(BIRTH))/86400e3);if(days<0)return '';return Math.floor(days/7)+'周'+(days%7)+'天'}
function segSums(segs){var L=0,R=0,nw=Date.now();(segs||[]).forEach(function(g){var e=g.end||nw;var d=Math.max(0,e-g.start);if(g.s==='L')L+=d;else R+=d});return{L:Math.round(L/60000),R:Math.round(R/60000)}}
function weekday(s){return '日一二三四五六'.charAt(new Date(ymdUtc(s)).getUTCDay())}
function mdLabel(s){var p=s.split('-');return (+p[1])+'月'+(+p[2])+'日'}
// 睡眠按自然日（午夜0点）切分归属；进行中→now，动态计入
function sleepOverlapMin(r,ds){
 if(r.type!=='sleep')return 0;var d=r.data||{};
 var st=new Date(r.start_at).getTime();
 var en=d.open?Date.now():(d.durationMin?st+d.durationMin*60000:null);
 if(!en)return 0;
 var d0=dayStartMs(ds),d1=d0+86400e3;
 return Math.max(0,(Math.min(en,d1)-Math.max(st,d0))/60000);
}
function isNapRec(r){var h=bj(new Date(r.start_at).getTime()).getUTCHours();return h>=6&&h<19}

function breastPink(d){
  if(d.open){var s=segSums(d.segs);return '喂奶中… 左'+s.L+'分 右'+s.R+'分'}
  var L=d.leftMin,R=d.rightMin;
  if(L!=null||R!=null){L=L||0;R=R||0;
    var first=(d.segs&&d.segs.length)?d.segs[0].s:'L';
    if(L&&R)return first==='L'?('左 '+L+'分钟 → 右 '+R+'分钟'):('右 '+R+'分钟 → 左 '+L+'分钟');
    if(L)return '左 '+L+'分钟';if(R)return '右 '+R+'分钟';return ''}
  if(d.min)return d.min+'分钟';return ''
}
function formulaPink(d){
  var s=(d.approx?'约':'')+(d.ml!=null?d.ml+'ml':'?ml');
  if(d.prepared&&d.prepared>(d.ml||0))s+='（冲'+d.prepared+'）';
  return s;
}
function buildNodes(rs){
  var nodes=[];
  rs.forEach(function(r){
    var st=new Date(r.start_at).getTime(),d=r.data||{};
    var quote=(d.src==='speak'&&r.note)?r.note:'';
    if(r.type==='sleep'){
      nodes.push({t:st,pt:'sleep',name:'睡觉',pink:d.open?'睡着中…':'',quote:quote,rec:r,sk:1,delLabel:'睡眠 '+fmtT(st)});
      if(d.durationMin)nodes.push({t:st+d.durationMin*60000,pt:'wake',name:'起床',pink:durTxt(d.durationMin),rec:r,kind:'wake',sk:1,delLabel:'睡眠 '+fmtT(st)+'（连同睡觉节点）'});
    }else if(r.type==='walk'){
      if(d.needsStart){ // v29 反向配对：先记到家，出门待补
        nodes.push({t:st,pt:'walk_back',name:'散步 · 到家',pink:'出门时间待补',quote:quote,rec:r,delLabel:'散步(待补出门) '+fmtT(st)});
      }else{
      nodes.push({t:st,pt:'walk',name:'散步 · 出门',pink:d.open?'进行中…':(d.needsEnd?'到家时间待补':''),quote:quote,rec:r,delLabel:'散步 '+fmtT(st)});
      if(d.durationMin)nodes.push({t:st+d.durationMin*60000,pt:'walk_back',name:'回来',pink:durTxt(d.durationMin),rec:r,delLabel:'散步 '+fmtT(st)+'（连同出门节点）'});
      }
    }else if(r.type==='feed_breast'){
      nodes.push({t:st,pt:'feed_breast',name:'母乳',pink:breastPink(d),quote:quote,rec:r,kind:'milk',delLabel:'母乳 '+fmtT(st)});
    }else if(r.type==='feed_formula'){
      nodes.push({t:st,pt:'feed_formula',name:'配方奶',pink:formulaPink(d),quote:quote,rec:r,kind:'milk',delLabel:'配方奶 '+fmtT(st)});
    }else if(r.type==='feed_solid'){
      nodes.push({t:st,pt:'feed_solid',name:'辅食',pink:d.ml?d.ml+'ml':'',sub:d.food||'',quote:quote,rec:r,delLabel:'辅食 '+fmtT(st)});
    }else if(r.type==='vitamin'){
      var vn=d.note||d.name||'维生素';
      var vpt=/AD/i.test(vn)?'vitamin_ad':(/益生菌/.test(vn)?'probiotic':'vitamin');
      nodes.push({t:st,pt:vpt,name:vn,quote:quote,rec:r,delLabel:vn+' '+fmtT(st)});
    }else if(r.type==='achievement'||r.type==='bigmotor'||r.type==='track'){
      var mtitle=d.title||d.note||r.note||'';
      nodes.push({t:st,pt:r.type,name:r.type==='achievement'?'成就':(LABEL[r.type]||r.type),pink:mtitle,rec:r,delLabel:'成就 '+fmtT(st)+(mtitle?'（'+mtitle.slice(0,12)+'…）':'')});
    }else{
      var pink='',sub='',nm=LABEL[r.type]||r.type;
      if(r.type==='temp')pink=(d.tempC||'?')+'°C';
      else if(r.type==='water'||r.type==='drink')pink=d.ml?d.ml+'ml':'';
      else if(r.type==='vaccine')pink=d.note||'';
      else if(r.type==='growth'){ // 按字段直显具体项名，不再统一叫「测量」
        var gk=[];
        if(d.weightKg!=null){gk.push('体重');pink=d.weightKg+'kg'}
        if(d.heightCm!=null){gk.push('身高');pink=(pink?pink+' ':'')+d.heightCm+'cm'}
        if(d.headCm!=null){gk.push('头围');pink=(pink?pink+' ':'')+d.headCm+'cm'}
        if(gk.length)nm=gk.join('·'); sub=d.note||''}
      if(!sub&&d.note&&r.type!=='vaccine')sub=d.note; // 便便性状/医院备注等：Piyo 备注全部亮出
      if(r.type==='note')sub='';
      nodes.push({t:st,pt:r.type,name:nm,pink:pink,sub:sub,quote:quote,rec:r,delLabel:nm+' '+fmtT(st)});
    }
  });
  nodes.sort(function(a,b){return a.t-b.t});
  return nodes;
}
function who(r){var d=r.data||{};if(d.by)return{n:d.by,c:''};if((r.client_id||'').indexOf('piyo_')===0)return{n:'妈妈·手表',c:'piyo'};return{n:'',c:'piyo'}}

// ── 状态牌（一级页）：吃 / 睡 / 换 三张卡 ──
function statCards(rs){
  var now=Date.now(),today=todayStr(),h='';
  function pick(types){var b=null;rs.forEach(function(r){if(types.indexOf(r.type)<0)return;var t=new Date(r.start_at).getTime();if(!b||t>b._t){r._t=t;b=r}});return b}
  // 今日累计
  var tF=0,tS=0,tSml=0,tB=0,tBL=0,tBR=0,nPoop=0,slMin=0,napMin=0;
  rs.forEach(function(r){
    if(r.type==='sleep'){var ov=sleepOverlapMin(r,today);if(ov){slMin+=ov;if(isNapRec(r))napMin+=ov}return}
    if(bjDateStr(new Date(r.start_at).getTime())!==today)return;
    var d=r.data||{};
    if(r.type==='feed_formula')tF+=(+d.ml||0);
    if(r.type==='feed_solid'){tS++;tSml+=(+d.ml||0)}
    if(r.type==='feed_breast'){tB++;if(d.open&&d.segs){var so=segSums(d.segs);tBL+=so.L;tBR+=so.R}else{tBL+=(+d.leftMin||0)+(+d.min||0);tBR+=(+d.rightMin||0)}}
    if(r.type==='diaper_poop')nPoop++;
  });
  // 吃
  var fd=pick(['feed_breast','feed_formula','feed_solid','feed_bottle']);
  var cv='今天还没有喂养记录',cs='';
  if(fd){var fdd=fd.data||{};
    var det=fd.type==='feed_breast'?breastPink(fdd):(fd.type==='feed_formula'?formulaPink(fdd):((fdd.ml?fdd.ml+'ml ':'')+(fdd.food||'')));
    cv=fmtT(fd._t)+' '+(LABEL[fd.type]||'')+' '+esc(det)+'<br>距现在 <b>'+durTxt5((now-fd._t)/60000)+'</b>'}
  cs='今日 配方奶 '+tF+'ml · 辅食 '+tS+' 顿'+(tSml?'（'+tSml+'ml）':'')+' · 亲喂 '+tB+' 次';
  if(tBL||tBR)cs+='<br>亲喂 左'+tBL+'分 右'+tBR+'分 · 下顿先喂'+(tBL<tBR?'左':(tBR<tBL?'右':'任一'))+'边';
  h+='<div class="card"><div class="ck">'+badge('feed_formula')+'吃</div><div class="cv">'+cv+'</div><div class="cs">'+cs+'</div></div>';
  // 睡
  var sl=pick(['sleep']);cv='今天还没有睡眠记录';cs='今日累计 '+durTxt5(slMin)+(napMin?'（小觉 '+durTxt5(napMin)+'）':'');
  var slIcon='sleep';
  if(sl){var sd=sl.data||{};
    if(sd.open){cv='睡着中 · '+fmtT(sl._t)+' 起<br>已睡 <b>'+durTxt5((now-sl._t)/60000)+'</b>'}
    else if(sd.durationMin){var wk=sl._t+sd.durationMin*60000;slIcon='wake';
      cv=fmtT(wk)+' 起床<br>已醒 <b>'+durTxt5((now-wk)/60000)+'</b>';
      cs='上一觉 '+durTxt(sd.durationMin)+' · '+cs}}
  // 大人算法（姥姥口径）：晚6点为分割线，从上一个晚6点起累计到现在（含进行中）
  var t18=dayStartMs(today)+18*3600e3;
  var cyc0=now>=t18?t18:t18-86400e3;
  var cycMin=0;
  rs.forEach(function(r){
    if(r.type!=='sleep')return;var d=r.data||{};
    var st=new Date(r.start_at).getTime();
    var en=d.open?now:(d.durationMin?st+d.durationMin*60000:null);
    if(!en)return;
    cycMin+=Math.max(0,(Math.min(en,now)-Math.max(st,cyc0))/60000);
  });
  cs+='<br>'+(cyc0===t18?'今晚6点':'昨晚6点')+'到现在共睡 '+durTxt5(cycMin);
  h+='<div class="card"><div class="ck">'+badge(slIcon)+'睡</div><div class="cv">'+cv+'</div><div class="cs">'+cs+'</div></div>';
  // 换（上次便便跨任意天数：优先窗口内记录，否则用服务端 lastPoopAt）
  var pp=pick(['diaper_poop']);
  var ppT=pp?pp._t:(state.data&&state.data.lastPoopAt?new Date(state.data.lastPoopAt).getTime():null);
  cv='还没有便便记录';
  if(ppT){var pd=bjDateStr(ppT);
    var day=pd===today?'今天 ':(pd===shiftDate(today,-1)?'昨天 ':(+pd.split('-')[1])+'月'+(+pd.split('-')[2])+'日 ');
    cv='上次便便 '+day+fmtT(ppT)+'<br>距现在 <b>'+ago5(ppT)+'</b>'}
  h+='<div class="card"><div class="ck">'+badge('diaper_poop')+'换</div><div class="cv">'+cv+'</div><div class="cs">今日便便 '+nPoop+' 次'+(ppT?' · 上次 '+ago5(ppT)+'前':'')+'</div></div>';
  return h;
}

function daySummaryHTML(rs,dateStr){
  var bN=0,bL=0,bR=0,bMin=0,fN=0,fMl=0,sN=0,sMl=0,slMin=0,napMin=0,poop=0,vit=0,bath=0,wt=null;
  rs.forEach(function(r){
    if(r.type==='sleep'){var ov=sleepOverlapMin(r,dateStr);if(ov){slMin+=ov;if(isNapRec(r))napMin+=ov}return}
    if(bjDateStr(new Date(r.start_at).getTime())!==dateStr)return;
    var d=r.data||{};
    if(r.type==='feed_breast'){bN++;bL+=(+d.leftMin||0);bR+=(+d.rightMin||0);bMin+=(+d.min||0)}
    if(r.type==='feed_formula'){fN++;fMl+=(+d.ml||0)}
    if(r.type==='feed_solid'){sN++;sMl+=(+d.ml||0)}
    if(r.type==='diaper_poop')poop++;
    if(r.type==='vitamin')vit++;if(r.type==='bath')bath++;
    if(r.type==='growth'&&d.weightKg)wt=d.weightKg;
  });
  var out=[];
  function mk(bt,l1,l2){return badge(bt)+'<span class="s2">'+l1+(l2?'<br><b>'+l2+'</b>':'')+'</span>'}
  if(bN)out.push(mk('feed_breast',bN+'次',(bL+bMin)+'/'+bR+'分'));
  if(fN)out.push(mk('feed_formula',fN+'次',fMl+'ml'));
  if(sN)out.push(mk('feed_solid',sN+'次',sMl?sMl+'ml':''));
  if(slMin)out.push(mk('sleep',durTxt5(slMin),napMin?'小觉'+durTxt5(napMin):''));
  if(poop)out.push(mk('diaper_poop',poop+'次',''));
  if(vit)out.push(mk('vitamin',vit+'次',''));if(bath)out.push(mk('bath',bath+'次',''));
  if(wt)out.push(mk('growth',wt+'kg',''));
  return '<div class="sumwrap">'+(out.length?out.map(function(s){return '<span class="sumit">'+s+'</span>'}).join(''):'<span class="sumit" style="color:var(--sub)">这一天还没有记录</span>')+'</div>';
}

var FEEDT=['feed_breast','feed_formula','feed_solid','feed_bottle','water','drink','snack'];
function weekDays(){var a=[];for(var i=0;i<7;i++)a.push(shiftDate(state.sum.from,i));return a}
function sleepBlocks(rs){
  var days=weekDays(),blocks=[],now=Date.now();
  rs.forEach(function(r){
    if(r.type!=='sleep')return;var d=r.data||{};
    var st=new Date(r.start_at).getTime();
    var en=d.open?now:(d.durationMin?st+d.durationMin*60000:null);
    if(!en)return;
    var cls=isNapRec(r)?'var(--nap)':'var(--night)';
    days.forEach(function(ds,i){
      var d0=dayStartMs(ds),d1=d0+86400e3;
      var a=Math.max(st,d0),b=Math.min(en,d1);
      if(b<=a)return;
      blocks.push({day:i,top:(a-d0)/86400e3,hgt:(b-a)/86400e3,color:cls});
    });
  });
  return blocks;
}
function gridHTML(rs,opt){
  var days=weekDays();
  var h='<div class="gridwrap">'+(opt.overlay||'')+'<div class="grid" style="height:'+(opt.h||gridH())+'px">';
  for(var si=1;si<7;si+=2)h+='<div class="stripe" style="left:'+(si*100/7)+'%;width:'+(100/7)+'%"></div>';
  for(var hh=0;hh<=24;hh+=1){var pct=hh/24*100;
    h+='<div class="hline'+(hh%3===0?' h3':'')+'" style="top:'+pct+'%">'+(hh%3===0?'<span class="hlab">'+hh+'</span>':'')+'</div>'}
  var stack={},dots=[];
  rs.forEach(function(r){
    if(r.type==='sleep')return;
    if(opt.types&&opt.types.indexOf(r.type)<0)return;
    if(state.sum.hidden[r.type])return;
    var st=new Date(r.start_at).getTime();var ds=bjDateStr(st);
    var di=days.indexOf(ds);if(di<0)return;
    var frac=(st-dayStartMs(ds))/86400e3;
    var key=di+'_'+Math.floor(frac*48);stack[key]=(stack[key]||0)+1;
    dots.push({day:di,top:frac,type:r.type,off:stack[key]-1});
  });
  var blocks=(opt.sleep&&state.sum.showSleep)?sleepBlocks(rs):[];
  for(var i=0;i<7;i++){
    h+='<div class="col">';
    blocks.forEach(function(b){if(b.day===i)h+='<div class="blk" style="top:'+(b.top*100)+'%;height:'+(b.hgt*100)+'%;background:'+b.color+'"></div>'});
    dots.forEach(function(dt){
      if(dt.day!==i)return;var c=DOT[dt.type]||['#bbb',''];
      var POS=[50,29,71,12,88];  // 第一枚居中，其余对称展开
      var left=POS[Math.min(dt.off,POS.length-1)];
      if(c[1]==='star')h+='<div class="dot star" style="top:calc('+(dt.top*100)+'% - 5px);left:'+left+'%">★</div>';
      else h+='<div class="dot '+c[1]+'" style="top:calc('+(dt.top*100)+'% - 5px);left:'+left+'%;background:'+c[0]+'"></div>';
    });
    h+='</div>';
  }
  h+='</div></div><div class="daylabs">';
  days.forEach(function(ds){
    var dow=new Date(ymdUtc(ds)).getUTCDay();
    h+='<div class="daylab'+(dow===6?' sat':'')+(dow===0?' sun':'')+'">'+mdLabel(ds)+(opt.counts?'<div class="cnt">'+opt.counts(ds)+'</div>':'')+'</div>';
  });
  h+='</div>';
  return h;
}
function inDay(r,ds){return bjDateStr(new Date(r.start_at).getTime())===ds}

  h+='<div class="legend" style="text-wrap:pretty">The WHO Child Growth Standards (2006) · 女宝参考带（近似 ±2SD）</div>';

function chartSVG(mode,R,pts,H){
  var W=360;H=H||436;
  var L=36,Rt=324,T=16,B=H-40;
  function xs(m){return L+(m/R)*(Rt-L)}
  function mkYs(lo,hi){return function(v){return B-(v-lo)/(hi-lo)*(B-T)}}
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">';
  // 竖向网格：逐月细线，1年逐月标签 / 2年隔月标签
  var step=(R===12)?1:2;
  for(var m=0;m<=R;m++){
    s+='<line x1="'+xs(m)+'" y1="'+T+'" x2="'+xs(m)+'" y2="'+B+'" stroke="#f0ece6" stroke-width="1"'+(m%step?' stroke-dasharray="2 3"':'')+'/>';
    if(m%step===0)s+='<text x="'+xs(m)+'" y="'+(B+14)+'" font-size="9" fill="#9a938a" text-anchor="middle">'+m+'</text>';
  }
  // 横向网格（跟随左轴刻度）
  function hgrid(lo,hi,stepV){var out='';var ys=mkYs(lo,hi);
    for(var v=Math.ceil(lo);v<=hi;v+=stepV)out+='<line x1="'+L+'" y1="'+ys(v)+'" x2="'+Rt+'" y2="'+ys(v)+'" stroke="#eee7e0" stroke-width="1" stroke-dasharray="3 3"/>';
    return out}
  s+='<text x="'+Rt+'" y="'+(B+26)+'" font-size="9" fill="#9a938a" text-anchor="end">(月龄)</text>';
  function band(sr,lo,hi,ys,color){
    var p='M';
    for(var m=0;m<=R;m++)p+=xs(m)+' '+ys(sr.lo[m])+' L';
    p=p.slice(0,-1);
    for(m=R;m>=0;m--)p+='L'+xs(m)+' '+ys(sr.hi[m])+' ';
    return '<path d="'+p+'Z" fill="'+color+'"/>';
  }
  function series(arr,ys,color){
    if(!arr.length)return '';
    arr.sort(function(a,b){return a[0]-b[0]});
    var p='',c='';
    arr.forEach(function(pt,i){if(pt[0]>R)return;var x=xs(pt[0]),y=ys(pt[1]);
      p+=(p?'L':'M')+x+' '+y+' ';
      c+='<circle cx="'+x+'" cy="'+y+'" r="2.2" fill="'+color+'"/>'});
    return '<path d="'+p+'" fill="none" stroke="'+color+'" stroke-width="1.6"/>'+c;
  }
  function yAxis(lo,hi,stepV,x,anchor,color){
    var out='';
    for(var v=Math.ceil(lo);v<=hi;v+=stepV)out+='<text x="'+x+'" y="'+(mkYs(lo,hi)(v)+3)+'" font-size="9" fill="'+color+'" text-anchor="'+anchor+'">'+v+'</text>';
    return out;
  }
  if(mode==='wh'){
    // 严格照抄 Piyo 双轴：1年 kg1–12(步1)/cm30–80(步5)，4kg↔30cm、12kg↔80cm；
    // 2年 kg2–20(步2)/cm40–100(步5)，4kg↔40cm、20kg↔100cm；顶部留两行空行放单位
    var kLo,kHead,labs=[],cmB,cmSlope,cLo,cHi,kStep;
    if(R===12){kLo=1;kHead=2;kStep=1;cmB=30;cmSlope=6.25;cLo=30;cHi=80;for(var k=1;k<=12;k++)labs.push(k)}
    else{kLo=1;kHead=2;kStep=2;cmB=40;cmSlope=3.75;cLo=40;cHi=100;for(var k2=2;k2<=20;k2+=2)labs.push(k2)}
    var kTop=labs[labs.length-1]+kHead;
    var ysW=mkYs(kLo,kTop);
    var ysH=function(cm){return ysW(4+(cm-cmB)/cmSlope)};
    // 横向网格：每个 kg 刻度一条
    labs.forEach(function(v){s+='<line x1="'+L+'" y1="'+ysW(v)+'" x2="'+Rt+'" y2="'+ysW(v)+'" stroke="#eee7e0" stroke-width="1" stroke-dasharray="3 3"/>'});
    s+=band(WHO.ht,0,0,ysH,'rgba(120,165,220,.22)');
    s+=band(WHO.wt,0,0,ysW,'rgba(140,190,120,.26)');
    s+=series(pts.ht,ysH,'#4a84c6');
    s+=series(pts.wt,ysW,'#5c9a4a');
    labs.forEach(function(v){s+='<text x="'+(L-4)+'" y="'+(ysW(v)+3)+'" font-size="9" fill="#5c9a4a" text-anchor="end">'+v+'</text>'});
    s+='<text x="'+(L-4)+'" y="'+(ysW(kTop-0.6)+3)+'" font-size="9" fill="#5c9a4a" text-anchor="end">(kg)</text>';
    for(var c2=cLo;c2<=cHi;c2+=5)s+='<text x="'+(Rt+4)+'" y="'+(ysH(c2)+3)+'" font-size="9" fill="#4a84c6">'+c2+'</text>';
    s+='<text x="'+(Rt+4)+'" y="'+(ysH(cHi)-14)+'" font-size="9" fill="#4a84c6">(cm)</text>';
    s+='<text x="'+(L+16)+'" y="'+(T+20)+'" font-size="13" fill="#4a84c6" font-weight="600">身高</text>';
    s+='<text x="'+(Rt-46)+'" y="'+(B-16)+'" font-size="13" fill="#5c9a4a" font-weight="600">体重</text>';
  }else{
    var dLo=30,dHi=WHO.hd.hi[R]+1,ysD=mkYs(dLo,dHi);
    s+=hgrid(dLo,dHi,2);
    s+=band(WHO.hd,dLo,dHi,ysD,'rgba(150,130,210,.24)');
    s+=series(pts.hd,ysD,'#7d6bbf');
    s+=yAxis(dLo,dHi,2,L-4,'end','#7d6bbf')+'<text x="'+(L-4)+'" y="'+(T-2)+'" font-size="9" fill="#7d6bbf" text-anchor="end">(cm)</text>';
    s+='<text x="'+(L+16)+'" y="'+(T+18)+'" font-size="13" fill="#7d6bbf" font-weight="600">头围</text>';
  }
  s+='</svg>';
  return s;
}

  fetch(API_BASE+'?data=1&token='+encodeURIComponent(TOKEN)+'&date='+state.date)
  .then(function(r){return r.json()}).then(function(d){
    if(d.ok===false){showErr(d.msg||'加载失败');return}
    document.getElementById('err').style.display='none';state.data=d;
    if(state.view==='rec')renderRec();else if(state.view==='stat')renderStat();
  }).catch(function(){showErr('网络不通，稍后自动重试')});
}
function loadSum(){
  fetch(API_BASE+'?data=1&token='+encodeURIComponent(TOKEN)+'&from='+state.sum.from+'&days=7')
  .then(function(r){return r.json()}).then(function(d){
    if(d.ok===false){showErr(d.msg||'加载失败');return}
    document.getElementById('err').style.display='none';state.sum.data=d;if(state.view==='sum')renderSum();
  }).catch(function(){showErr('网络不通，稍后自动重试')});
}
function showErr(m){var e=document.getElementById('err');e.style.display='block';e.textContent=m}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},1800)}
/* ── 切换过渡：双层对滑（旧页滑出+新页滑入，同帧运动，无变淡）── */
var slideDir=0;
function nudge(){ // 点击瞬间的轻推反馈
  var el=document.getElementById(state.view==='sum'?'sumview':'tl');
  el.style.transition='transform .2s ease';
  el.style.transform='translateX('+(slideDir>0?-16:16)+'px)';
}
function swapIn(el,renderFn){
  if(!slideDir){el.style.transition='none';el.style.transform='';renderFn(el);return}
  var dir=slideDir;slideDir=0;
  var ghost=el.cloneNode(true);
  ghost.style.position='absolute';
  ghost.style.left=el.offsetLeft+'px';ghost.style.top=el.offsetTop+'px';
  ghost.style.width=el.offsetWidth+'px';ghost.style.margin='0';
  ghost.style.zIndex='5';ghost.style.transition='transform .26s ease';
  ghost.style.pointerEvents='none';
  el.parentNode.appendChild(ghost);
  renderFn(el);
  el.style.transition='none';
  el.style.transform='translateX('+(dir>0?100:-100)+'%)';
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    el.style.transition='transform .26s ease';el.style.transform='';
    ghost.style.transform='translateX('+(dir>0?-105:105)+'%)';
    setTimeout(function(){if(ghost.parentNode)ghost.parentNode.removeChild(ghost)},300);
  })});
}
function navRec(dir){
  slideDir=dir;state.date=shiftDate(state.date,dir);
  var p=state.date.split('-');
  document.getElementById('dlabel').textContent=p[0]+'年'+(+p[1])+'月'+(+p[2])+'日 周'+weekday(state.date); // 日期即时跳转
  nudge();loadRec();
}
function navSum(dir){
  slideDir=dir;state.sum.from=shiftDate(state.sum.from,dir*7);
  document.getElementById('dlabel').textContent=mdLabel(state.sum.from)+' ~ '+mdLabel(shiftDate(state.sum.from,6));
  nudge();loadSum();
}
/* ── 点按修改/删除 ── */
function post(bodyObj,cb){
  bodyObj.token=TOKEN;
  fetch(API_BASE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(bodyObj)})
  .then(function(r){return r.json()}).then(function(d){if(d.ok){cb&&cb()}else{toast(d.msg||'操作失败')}})
  .catch(function(){toast('网络不通')});
}
function afterEdit(){toast('已修改');closeSheet();loadRec();state.sum.data=null;state.mile.data=null;state.growth.data=null}
function closeSheet(){document.getElementById('sheet').style.display='none';document.getElementById('sheetbg').style.display='none'}
function editTime(rec){
  var st=new Date(rec.start_at).getTime();
  var v=prompt('修改时间（HH:MM）',fmtT(st));if(!v)return;
  var mm=v.match(/^(\d{1,2}):(\d{2})$/);if(!mm){toast('格式要像 08:20');return}
  var ds=bjDateStr(st);var p=ds.split('-');
  var utc=Date.UTC(+p[0],+p[1]-1,+p[2],+mm[1],+mm[2])-8*3600e3;
  post({action:'update',id:rec.id,start_at:new Date(utc).toISOString()},afterEdit);
}
function editDetail(rec){
  var d=rec.data||{},t=rec.type,patch=null;
  function num(msg,cur){var v=prompt(msg,cur==null?'':cur);if(v===null)return null;var n=parseFloat(v);return isNaN(n)?null:n}
  if(t==='feed_formula'||t==='water'||t==='drink'){var ml=num('毫升数',d.ml);if(ml===null)return;patch={ml:ml}}
  else if(t==='feed_breast'){var L=num('左边分钟',d.leftMin||d.min||0);if(L===null)return;var R=num('右边分钟',d.rightMin||0);if(R===null)return;patch={leftMin:L,rightMin:R,min:0}}
  else if(t==='feed_solid'){var fo=prompt('吃了什么',d.food||'');if(fo===null)return;var sml=num('毫升数（没有填0）',d.ml||0);if(sml===null)return;patch={food:fo,ml:sml}}
  else if(t==='sleep'){var du=num('睡眠时长（分钟）',d.durationMin||'');if(du===null)return;patch={durationMin:du,open:false}}
  else if(t==='walk'){var dw=num('散步时长（分钟）',d.durationMin||'');if(dw===null)return;patch={durationMin:dw,open:false}}
  else if(t==='temp'){var tc=num('体温（°C）',d.tempC);if(tc===null)return;patch={tempC:tc}}
  else if(t==='growth'){var wk=num('体重（kg，不改按取消）',d.weightKg);if(wk!==null){patch={weightKg:wk}}else{return}}
  else if(t==='achievement'||t==='bigmotor'||t==='track'){var mv=prompt('大事记内容',d.title||d.note||rec.note||'');if(mv===null)return;post({action:'update',id:rec.id,dataPatch:{title:mv,note:mv},note:mv},afterEdit);return}
  else{var nt=prompt('备注内容',rec.note||'');if(nt===null)return;post({action:'update',id:rec.id,note:nt},afterEdit);return}
  post({action:'update',id:rec.id,dataPatch:patch},afterEdit);
}
function openSheet(rec,label){
  var sh=document.getElementById('sheet');
  sh.innerHTML='<div class="shhead">'+esc(label)+(rec.note?'<br>“'+esc(rec.note)+'”':'')+'</div>'+
    '<button class="shbtn" id="shTime">修改时间</button>'+
    '<button class="shbtn" id="shDetail">修改内容</button>'+
    '<button class="shbtn danger" id="shDel">删除这条记录</button>'+
    '<button class="shbtn" id="shCancel">取消</button>';
  sh.style.display='block';document.getElementById('sheetbg').style.display='block';
  document.getElementById('shTime').onclick=function(){editTime(rec)};
  document.getElementById('shDetail').onclick=function(){editDetail(rec)};
  document.getElementById('shDel').onclick=function(){
    if(!confirm('确定删除？\n'+label))return;
    post({action:'delete',id:rec.id},function(){toast('已删除');closeSheet();loadRec();state.sum.data=null});
  };
  document.getElementById('shCancel').onclick=closeSheet;
  document.getElementById('sheetbg').onclick=closeSheet;
}
function switchView(vw){
  state.view=vw;
  document.querySelectorAll('#tabbar .tab').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===vw)});
  document.getElementById('statview').style.display=(vw==='stat')?'block':'none';
  document.getElementById('tl').style.display=(vw==='rec')?'block':'none';
  document.getElementById('sumview').style.display=(vw==='sum')?'block':'none';
  document.getElementById('skillview').style.display=(vw==='skill')?'block':'none';
  document.getElementById('subtabs').style.display=(vw==='sum')?'flex':'none';
  document.getElementById('sumbar').style.display=(vw==='rec')?'block':'none';
  document.getElementById('dpick').style.pointerEvents=(vw==='rec')?'auto':'none';
  var hideArrows=(vw==='stat'||vw==='skill');
  document.getElementById('prevD').style.visibility=hideArrows?'hidden':'visible';
  document.getElementById('nextD').style.visibility=hideArrows?'hidden':'visible';
  document.getElementById('searchBtn').style.display=(vw==='rec')?'block':'none';
  if(vw==='stat'){state.date=todayStr();if(state.data)renderStat();loadRec()}
  if(vw==='rec'){if(state.data)renderRec();else loadRec()}
  if(vw==='sum'){if(!state.sum.from)state.sum.from=mondayOf(todayStr());if(state.sum.data)renderSum();else loadSum()}
  if(vw==='skill'){if(state.skill.data)renderSkillView();loadSkills()}
  fixPad();
}
document.getElementById('prevD').onclick=function(){
  if(state.view==='sum')navSum(-1);else if(state.view==='rec')navRec(-1)};
document.getElementById('nextD').onclick=function(){
  if(state.view==='sum')navSum(1);else if(state.view==='rec')navRec(1)};
document.getElementById('todayBtn').onclick=function(){
  if(state.view==='sum'){state.sum.from=mondayOf(todayStr());loadSum()}
  else{state.date=todayStr();loadRec()}};
document.getElementById('dpick').onchange=function(){if(this.value){state.date=this.value;loadRec()}};
document.getElementById('tl').addEventListener('click',function(e){
  if(e.target.getAttribute&&e.target.getAttribute('data-clear')){loadRec();return}
  var row=e.target.closest?e.target.closest('.row'):null;if(!row)return;
  var go=row.getAttribute('data-goto');
  if(go){state.date=go;loadRec();return}
  var id=row.getAttribute('data-id');if(!id)return;
  var rec=null;(state.data&&state.data.records||[]).forEach(function(r){if(r.id===id)rec=r});
  if(!rec)return;
  openSheet(rec,row.getAttribute('data-label'));
});
document.querySelectorAll('#subtabs .stab').forEach(function(b){
  b.onclick=function(){state.sum.sub=b.getAttribute('data-st');
    document.querySelectorAll('#subtabs .stab').forEach(function(x){x.classList.toggle('on',x===b)});
    renderSum()};
});
document.querySelectorAll('#tabbar .tab').forEach(function(b){
  b.onclick=function(){var t=b.getAttribute('data-tab');
    switchView(t);
  };
});
document.addEventListener('click',function(e){var pop=document.getElementById('filtPop');if(pop&&pop.style.display==='block'&&!pop.contains(e.target)&&e.target.id!=='filtBtn')pop.style.display='none'});

// ── 横滑手势：记录页切天，摘要页切周 ──
(function(){
  var sx=0,sy=0,st=0;
  var main=document.getElementById('main');
  main.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
  },{passive:true});
  main.addEventListener('touchend',function(e){
    if(!st||Date.now()-st>600){st=0;return}
    var t=e.changedTouches[0];
    var dx=t.clientX-sx,dy=t.clientY-sy;st=0;
    if(Math.abs(dx)<64||Math.abs(dx)<Math.abs(dy)*1.6)return; // 太短或偏竖向=滚动
    var dir=dx<0?1:-1; // 左滑=下一天/周
    if(state.view==='rec')navRec(dir);
    else if(state.view==='sum'&&state.sum.sub!=='grow')navSum(dir);
  },{passive:true});
})();
state.date=todayStr();
switchView('stat');
setInterval(function(){if(document.hidden)return;if(state.view==='stat')loadRec();if(state.view==='rec'&&state.date===todayStr())loadRec();if(state.view==='sum')loadSum()},300000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){if(state.view==='rec'||state.view==='stat')loadRec();else if(state.view==='sum')loadSum()}});
window.addEventListener('resize',fixPad);
</script></body></html>
